services:
  rt-control:
    build:
      context: .
      dockerfile: docker/rt-control/Dockerfile
      network: host
      args:
        IGH_VERSION: "${IGH_VERSION:?IGH_VERSION must come from versions.env}"
        IGH_COMMIT: "${IGH_COMMIT:?IGH_COMMIT must come from versions.env}"
        HTTP_PROXY: "${RT_CONTROL_BUILD_PROXY:-}"
        HTTPS_PROXY: "${RT_CONTROL_BUILD_PROXY:-}"
    image: "rt-control:${RT_CONTROL_IMAGE_TAG:?RT_CONTROL_IMAGE_TAG must be the approved release tag}"
    network_mode: host
    ipc: host
    devices: ["/dev/EtherCAT0:/dev/EtherCAT0"]
    cap_add: [SYS_NICE, IPC_LOCK, NET_RAW]
    ulimits: {rtprio: 98, memlock: -1}
    cpuset: "${RT_CONTROL_CPUSET:?RT_CONTROL_CPUSET must include housekeeping CPUs and the RT CPU}"
    environment:
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      RT_CONTROL_START_CPUSET: "${RT_CONTROL_START_CPUSET:?RT_CONTROL_START_CPUSET must be the housekeeping CPU list}"
      RT_CONTROL_START_PLC: "true"
      RT_CONTROL_START_BMS: "true"
    restart: unless-stopped
    stop_grace_period: 100s
