# Arm console motion policy (ELECTRI-127, user decision 2026-10-17).
# Gear limits act on the joint with the largest move; all joints arrive together.
# Acceleration = 2 x velocity (user). Jerk: the acceleration ramp lasts 0.25 s.
gears:
  test_low5:
    label: 测试低速5°/s
    velocity_deg_s: 5.0
    acceleration_deg_s2: 10.0
    jerk_deg_s3: 40.0
  test_low2:
    label: 测试低速2°/s
    velocity_deg_s: 2.0
    acceleration_deg_s2: 4.0
    jerk_deg_s3: 16.0
  speed_3:
