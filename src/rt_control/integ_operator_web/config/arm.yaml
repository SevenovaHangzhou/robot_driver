# Targets stay this far inside each Robot Model position limit.
limit_margin_deg: 2.0
# Planning and execution need joint feedback younger than this.
max_feedback_age_s: 0.2
# Below the left_arm_jtc start-consistency tolerance (1 deg).
start_tolerance_deg: 0.5
sample_period_s: 0.01
# A stop trajectory joins the running motion this far ahead (< 1 deg at 30 deg/s).
stop_lead_s: 0.02
# Trajectory t = 0 (header.stamp) is this far after sending; covers transport delay.
start_delay_s: 0.05
