<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ALFA 机械臂操作台</title>
  <link rel="stylesheet" href="/static/arm/style.css">
</head>
<body>
  <section id="login" class="login">
    <form id="login-form" class="card login-card">
      <h1>ALFA 机械臂操作台</h1>
      <input id="token" type="password" autocomplete="current-password" placeholder="访问令牌" required>
      <button type="submit" class="primary">登录</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span><b>ALFA</b><span>左臂</span>
      <span id="mock-chip" class="chip" hidden>Mock · 非实机</span><a class="chip" href="/">底盘页</a></div>
    <div class="topbar-status">
      <div class="chips">
      <span id="conn-chip" class="chip bad">未连接</span>
      <span id="enable-chip" class="chip">--</span>
      <span id="ctrl-chip" class="chip">控制器 --</span>
      </div>
      <div id="vacuum-pressure" class="vacuum-pressure" role="group" aria-label="真空压力，表压">
        <div class="pressure-reading" data-pressure="left" title="AI0 · 左侧真空表压">
          <span class="pressure-label">左真空</span>
          <span><strong class="pressure-value">—</strong> <span class="pressure-unit">kPa</span></span>
          <small class="pressure-status">等待数据</small>
        </div>
        <div class="pressure-reading" data-pressure="right" title="AI1 · 右侧真空表压">
          <span class="pressure-label">右真空</span>
          <span><strong class="pressure-value">—</strong> <span class="pressure-unit">kPa</span></span>
          <small class="pressure-status">等待数据</small>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel viewer-panel">
      <div id="viewer" class="viewer"></div>
      <div class="legend"><span class="sw measured"></span>实测<span class="sw ghost"></span>目标预览</div>
      <p id="model-msg" class="overlay-msg">等待机器人模型</p>
    </section>

    <section class="panel side">
      <div class="card controls">
        <div class="control-buttons">
          <button id="lease-btn" type="button" class="lease">获取控制权</button>
          <button id="enable-btn" type="button" class="primary">使能</button>
          <button id="disable-btn" type="button">失能</button>
          <button id="reset-btn" type="button" class="reset" title="清除驱动故障，回到禁止合闸；不会使能">故障复位</button>
        </div>
        <div id="gears" class="gears"></div>
      </div>

      <section id="vacuum-panel" class="card vacuum-panel" aria-labelledby="vacuum-title">
        <div class="card-head"><h2 id="vacuum-title">真空控制</h2>
          <span id="vacuum-chip" class="chip">等待读取</span></div>
        <div class="vacuum-buttons">
          <button type="button" data-vacuum="pump" disabled><span>真空泵</span><strong>未知</strong><small>等待读取</small></button>
          <button type="button" data-vacuum="left" disabled><span>左臂阀</span><strong>未知</strong><small>等待读取</small></button>
          <button type="button" data-vacuum="right" disabled><span>右臂阀</span><strong>未知</strong><small>等待读取</small></button>
        </div>
        <p id="vacuum-message" class="hint" role="status" aria-live="polite">登录后读取开关状态</p>
        <p class="hint">三个开关独立控制；开启状态不代表已吸附。</p>
      </section>

      <div class="card">
        <div class="card-head"><h2>关节目标</h2>
          <button id="sync-btn" type="button" class="small">目标 = 当前位置</button></div>
        <div id="joints" class="joints"></div>
        <p id="ready-msg" class="hint"></p>
        <div class="row">
          <button id="send-btn" type="button" class="primary wide">发送到目标…</button>
          <button id="stop-btn" type="button" class="danger wide">停止</button>
        </div>
        <div id="progress" class="progress" hidden><i></i><span></span></div>
        <p id="result-msg" class="hint"></p>
      </div>

      <div class="card">
        <div class="card-head"><h2>位姿</h2></div>
        <form id="pose-form" class="row">
          <input id="pose-name" maxlength="32" placeholder="位姿名称" required>
          <button type="submit">保存当前位姿</button>
        </form>
        <ul id="poses" class="poses"></ul>
        <div class="sequence">
          <div class="card-head"><h2>位姿序列</h2><small id="sequence-count" class="hint-inline"></small></div>
          <div class="row">
            <label for="sequence-dwell">新增段默认停留（秒）</label>
            <input id="sequence-dwell" type="number" min="0" step="0.1" value="0">
            <button id="sequence-apply" type="button">当前速度和停留应用到全部段</button>
          </div>
          <p class="hint">每段速度用于前往该位姿；停留从到位后开始，最后一段也停留。每段可单独修改。</p>
          <ol id="sequence" class="sequence-list"></ol>
          <p id="sequence-empty" class="hint">在上方位姿上点“+ 序列”按顺序加入，可重复加入。</p>
          <div class="row">
            <button id="sequence-run" type="button" class="primary wide">依次执行</button>
            <button id="sequence-clear" type="button" class="wide">清空</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <dialog id="confirm">
    <form method="dialog" class="card">
      <h2 id="confirm-title">确认运动</h2>
      <p id="confirm-body"></p>
      <table id="confirm-table" class="confirm-table"></table>
      <div class="row">
        <button value="cancel" type="submit">取消</button>
        <button id="confirm-ok" value="ok" type="submit" class="primary">确认执行</button>
      </div>
    </form>
  </dialog>
  <p id="toast" class="toast" hidden></p>
  <script type="module" src="/static/arm/app.js"></script>
</body>
</html>
