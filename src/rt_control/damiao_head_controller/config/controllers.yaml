controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    head_position_controller:
      type: forward_command_controller/ForwardCommandController
    damiao_head_manager:
      type: damiao_head_controller/HeadManagerController

joint_state_broadcaster:
  ros__parameters:
    update_rate: 50
    joints: [head_joint, head_pitch_joint]
    interfaces: [position, velocity, effort]

head_position_controller:
  ros__parameters:
    joints: [head_joint, head_pitch_joint]
    interface_name: position

damiao_head_manager:
  ros__parameters:
    joints: [head_joint, head_pitch_joint]
    control_name: damiao_head_control
    position_controller_name: head_position_controller
    service_prefix: /rt/head
    service_timeout_ms: 5000
    controller_switch_timeout_ms: 1000
    diagnostic_feedback_timeout_ms: 100.0
