bms_node:
  ros__parameters:
    can_interface: can1
    protocol: golden_phoenix_v1_1
    can_bitrate: 250000
    bms_address: 1
    host_address: 64
    multi_byte_order: auto
    request_period_s: 0.2
    receive_timeout_s: 0.5
    reconnect_period_s: 2.0
    publish_period_s: 5.0
    frame_timeout_s: 3.0
    battery_state_topic: /battery_state
