schema_version: 1
kind: manifest
status: draft
verified: false
authorities:
  source: Synthetic test data; never production facts
pending_facts:
- Synthetic only
robot_variant: SyntheticB
functional_modules:
- mobile_fixture
- encoder_fixture
modules:
  mobile_fixture:
    role: actuator_group
    transport: ethercat
    config_file: machines/SyntheticB/mobile_fixture.yaml
    actuator_count: 4
    sensor_count: 0
    mode_groups:
    - name: mode_8
      count: 2
      mode_of_operation: 8
      interface: position
      certified: false
    - name: mode_9
      count: 2
      mode_of_operation: 9
      interface: velocity
      certified: false
    device_refs:
    - devices/synthetic_output_drive.yaml
  encoder_fixture:
    role: state_sensor_group
    transport: canopen
    config_file: machines/SyntheticB/encoder_fixture.yaml
    actuator_count: 0
    sensor_count: 2
    mode_groups: []
    device_refs:
    - devices/synthetic_angle_sensor.yaml
robot_model:
  package: synthetic_model
  variants:
    gripper:
      xacro_file: urdf/gripper.urdf.xacro
      joint_limits_file: config/gripper_limits.yaml
      initial_positions_file: config/gripper_initial.yaml
    suction:
      xacro_file: urdf/suction.urdf.xacro
      joint_limits_file: config/suction_limits.yaml
      initial_positions_file: config/suction_initial.yaml
hardware_options:
  accessory:
    none:
      modules: []
      status: ready
      pending_facts: []
profiles:
  bench:
    status: draft
    modules:
    - mobile_fixture
    - encoder_fixture
    allowed_scopes:
    - bench
    hardware_options:
      accessory:
      - none
    pending_facts:
    - Synthetic only
scopes:
  bench:
    enabled_modules:
    - mobile_fixture
    - encoder_fixture
    required_state_modules:
    - encoder_fixture
    actuator_groups:
    - module: mobile_fixture
      mode_group: mode_8
    - module: mobile_fixture
      mode_group: mode_9
    jtc_groups: []
    global_readiness: partial_scope
owner_refs:
  ethercat: synthetic_protocol_0
  canopen: synthetic_protocol_1
layout:
  ethercat:
    cycle_hz: 1000
  canopen:
    sync_period_us: 4000
