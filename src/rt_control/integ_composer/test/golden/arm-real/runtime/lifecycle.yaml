bus_locks:
- ethercat-master-0
capabilities:
- name: enable
  service: /rt/enable
  type: RtEnable
control_scope: arms_only
hardware:
- name: ecat_arms
  plugin: ethercat_driver/EthercatDriver
hardware_activation_order:
- ecat_arms
host: {}
lifecycle_controllers:
- joint_state_broadcaster
- rt_internal_state_broadcaster
- enable_manager
mode_controllers:
- whole_body_jtc
- rolling_trajectory_controller
motion_controllers:
- whole_body_jtc
- rolling_trajectory_controller
publish_robot_state: true
staged_hardware_activation: true
transports:
- hw_ethercat
use_mock_hardware: false
