bus_locks: []
capabilities:
- controller: head_position_controller
  name: head_position
  topic: /head_position_controller/commands
  type: std_msgs/msg/Float64MultiArray
- name: enable
  service: /rt/enable
  type: RtEnable
control_scope: head_only
hardware:
- name: damiao_head
  plugin: mock_components/GenericSystem
hardware_activation_order:
- damiao_head
host: {}
lifecycle_controllers:
- joint_state_broadcaster
- enable_manager
motion_controllers:
- head_position_controller
publish_robot_state: true
staged_hardware_activation: true
transports:
- hw_can_damiao
use_mock_hardware: true
