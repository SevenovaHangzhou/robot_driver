rename_map:
  alfa_v3_stationary_enable: Alfa_V3_stationary_enable
# Removed one-shot generator; last version: git show 70c831c:src/rt_control/rt_control_composer/test/golden/generate_head_force_baseline.py
head_force_generation_command: python3 test/golden/generate_head_force_baseline.py --baseline <READ_ONLY_BASELINE>
  --output test/golden
model_switch_regeneration:
  robot_description_revision: 5ec6b653d7b72f9d25fecea4d71e5d640ce468ca
  reason: 'ELECTRI-127 user decision 2026-10-17: Alfav3 dual arms on the deployed mobile model
    (robot_alfav3_mobile.urdf); arm zero = Alfav3 export zero, no named poses/initial positions'
  method: composer output written only where the canonical form differs from the previous freeze; YAML
    stored in canonical form; legacy-builder equivalence was proven at source_commit
  cases:
  - arm-mock
  - arm-real
  - arm-mock-jtc
  - arm-real-jtc
  - stationary-mock
  - stationary-real
  - head-mock
  - head-real
rolling_joints_regeneration:
  reason: 'arch-s6 user decision 2026-10-29: rolling controller joint names come only from machine_config
    (policy motion.joints); the controller no longer hard-codes them'
  method: only the rolling_trajectory_controller.ros__parameters.joints key was added; every other value
    is unchanged and was checked by canonical comparison before regeneration
  cases:
  - arm-mock
  - arm-real
head_enable_manager_regeneration:
  reason: 'arch-s7 user decision 2026-10-29: the DaMiao head is enabled by enable_manager as a
    handshake device; damiao_head_controller/HeadManagerController is removed and head_only runs
    under the staged scope runtime'
  method: compose output written only where the canonical form differs; the differences are
    the manager (damiao_head_manager replaced by enable_manager with the same 5 s operation and
    1 s switch timing), hardware_components_initial_state for staged activation, and the new
    runtime/lifecycle.yaml (publish_robot_state true, as the removed head launch did)
  cases:
  - head-mock
  - head-real
staged_scope_regeneration:
  reason: 'arch-s8 user decision 2026-10-29: arms_only, arms_stationary_enable and force_bench run
    under the staged scope runtime; the dedicated arm, enable-only and force launches are removed'
  method: compose output written only where the canonical form differs; the differences are
    controller_manager hardware_components_initial_state (hardware starts unconfigured and is
    activated after preflight) and the new runtime/lifecycle.yaml; every other value is unchanged
  cases:
  - arm-mock
  - arm-real
  - arm-mock-jtc
  - arm-real-jtc
  - stationary-mock
  - stationary-real
bench_integration_regeneration:
  reason: 'arch-bench-dual-integrate 2026-10-30: robot_description updated to robot_description
    main 12a83dd (tree adc9512, PR #7 there: unified J2 limits, arm collision meshes)'
  method: compose output written only where the canonical form differs; arm cases differ only in
    robot_description.xml; force cases keep the historical six-responder bench through the test
    fixture and are unchanged; head cases differ in robot_description.xml and the joint names,
    head_joint/head_pitch_joint -> H1_joint (yaw)/H2_joint (pitch) per user 2026-10-30
  cases:
  - arm-mock
  - arm-real
  - arm-mock-jtc
  - arm-real-jtc
  - head-mock
  - head-real
head_thread_priority_regeneration:
  reason: 'arch-fix-head-thread-priority 2026-10-30: scopes with a complete controller_file now carry
    controller_defaults thread_priority 80; the scope runtime realtime check requires one FIFO 80
    update thread and refused head_only on the bench'
  method: compose output written only where the canonical form differs; head cases differ only in
    controller_manager.ros__parameters.thread_priority
  cases:
  - head-mock
  - head-real
force_thread_priority_regeneration:
  reason: 'arch-fix-force-thread-priority 2026-10-30: minimal_robot scopes keep controller_defaults
    thread_priority 80; the scope runtime realtime check requires one FIFO 80 update thread, and the
    user kept force_bench as the V3 bluepoint raw bench'
  method: compose output written only where the canonical form differs; force cases differ only in
    controller_manager.ros__parameters.thread_priority
  cases:
  - force-mock
  - force-real
ctrl_rename_regeneration:
  reason: 'arch-r2 2026-10-30: control packages renamed to the ctrl_ prefix (ARCHITECTURE §5a); pluginlib
    class names follow the package'
  method: only controller plugin type strings changed (enable_manager/ -> ctrl_enable_manager/, rolling_trajectory_controller/
    -> ctrl_rolling_trajectory/, rt_force_torque_broadcaster/ -> ctrl_force_torque_broadcaster/); controller
    instance names are unchanged
  cases:
  - arm-mock
  - arm-real
  - arm-mock-jtc
  - arm-real-jtc
  - stationary-mock
  - stationary-real
  - head-mock
  - head-real
  - force-mock
  - force-real
hw_rename_regeneration:
  reason: 'arch-r3 2026-10-30: protocol packages renamed to the hw_ prefix (ARCHITECTURE §5a); pluginlib
    class names and owner names follow the package'
  method: only hardware plugin names (robot_hw_ethercat/, robot_hw_can/ -> hw_ethercat/, hw_can_damiao/)
    in robot_description.xml and controllers.yaml and the owner names in lifecycle.yaml transports changed;
    legacy source paths recorded at source_commit are unchanged
  cases:
  - arm-mock
  - arm-real
  - arm-mock-jtc
  - arm-real-jtc
  - stationary-mock
  - stationary-real
  - head-mock
  - head-real
  - force-mock
  - force-real
rolling_digests_regeneration:
  reason: 'arch-c6 user decision 2026-10-31: the composer computes the rolling axis_set_hash and the envelope
    limits_version (SHA-256 of the artifact copy); the controller only parses and compares them and no
    longer links OpenSSL'
  method: only the rolling_trajectory_controller.ros__parameters axis_set_hash and limits_version keys
    were added; both values equal what the controller previously computed (interface axis set f4c8ff…,
    envelope 167339…); every other value is unchanged and was checked by canonical comparison
  cases:
  - arm-mock
  - arm-real
diagnostics_devices_regeneration:
  reason: 'arch-g1 design 2026-10-31 (operator-web-and-diagnostics-design.md §5.1): the composer writes
    the integ_diagnostics device list diagnostics.yaml from owner results'
  method: only runtime/diagnostics.yaml was added to each case; every existing output is unchanged and
    was checked by canonical comparison before regeneration
  cases:
  - arm-mock
  - arm-real
  - arm-mock-jtc
  - arm-real-jtc
  - stationary-mock
  - stationary-real
head_position_capability_regeneration:
  reason: 'arch-w4 user request 2026-10-31: the operator web head page discovers the head command topic
    through a head_position capability declared on head_position_controller'
  method: only the head_position entry was added to runtime/lifecycle.yaml capabilities; every other output
    is unchanged and was checked by canonical comparison
  cases:
