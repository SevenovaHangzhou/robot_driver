bus_locks: []
capabilities:
- controller: head_position_controller
  name: head_move
  topic: /rt/head/move
  type: robot_rt_control_interfaces/action/MoveHead
- name: enable
  service: /rt/enable
  type: RtEnable
control_scope: head_only
hardware:
- name: damiao_head
  plugin: hw_can_damiao/DamiaoSystem
hardware_activation_order:
- damiao_head
host: {}
lifecycle_controllers:
- joint_state_broadcaster
- enable_manager
motion_controllers:
- head_position_controller
publish_robot_state: true
staged_hardware_activation: true
transports:
- hw_can_damiao
use_mock_hardware: false
