controller_manager:
  ros__parameters:
    enable_manager:
      type: enable_manager/EnableManagerController
    hardware_components_initial_state:
      unconfigured:
      - damiao_head
    head_position_controller:
      type: forward_command_controller/ForwardCommandController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    thread_priority: 80
    update_rate: 1000
enable_manager:
  ros__parameters:
    batch_timeout: 5.0
    controller_switch_timeout: 1.0
    diagnostic_joint_interfaces:
    - fault_code
    - mos_temperature
    - motor_temperature
    - feedback_age_ms
    diagnostic_joints:
    - H1_joint
    - H2_joint
    disable_stage_timeout: 5.0
    fault_reset_timeout: 5.0
    handshake_devices:
    - damiao_head_control
    jtc_name: head_position_controller
head_position_controller:
  ros__parameters:
    interface_name: position
    joints:
    - H1_joint
    - H2_joint
joint_state_broadcaster:
  ros__parameters:
    interfaces:
    - position
    - velocity
    - effort
    joints:
    - H1_joint
    - H2_joint
    update_rate: 50
