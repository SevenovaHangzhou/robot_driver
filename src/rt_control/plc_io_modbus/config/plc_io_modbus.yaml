plc_io_modbus:
  ros__parameters:
    digital:
      module:
        host: "192.168.1.12"
        port: 502
        unit_id: 1
      inputs:
        infrared_laser:
          # Installed side/count/active level are not yet frozen for the V3 public interface.
          configured: false
          active_high: true
          di_address: 0
      outputs:
        # Vacuum V3 output addresses are deliberately invalid until the installed wiring is recorded.
        vacuum_pump_relay:
          do_address: -1
        left_vacuum_valve:
          do_address: -1
        right_vacuum_valve:
          do_address: -1

    analog:
      module:
        host: "192.168.1.13"
        port: 502
        unit_id: 1
      inputs:
        # Both channels retain the documented ZSE30A conversion as a reviewable template.
        # Registers and installed sensor identities remain fail-closed.
        left_vacuum_sensor:
          sensor_id: "TBD"
          register: -1
          raw_at_zero_kpa: 1000.0
          raw_at_full_scale: 5000.0
          full_scale_kpa: -101.0
          valid_raw_min: 800
          valid_raw_max: 5200
        right_vacuum_sensor:
          sensor_id: "TBD"
          register: -1
          raw_at_zero_kpa: 1000.0
          raw_at_full_scale: 5000.0
          full_scale_kpa: -101.0
          valid_raw_min: 800
          valid_raw_max: 5200

    # Set true only after both pressure channels and all three outputs are confirmed.
    vacuum_system:
      configured: false

    poll_period: 0.2

# Domain-private endpoints:
# /plc/vacuum_pump, /plc/vacuum_valve/{left,right}: SetDigitalOutput
# /plc/io_state: PlcIoState
# /plc_io/vacuum/{left,right}: VacuumSensorState
# /plc_io/infrared_laser: legacy Bool observation; the public adapter adds identity/validity.
