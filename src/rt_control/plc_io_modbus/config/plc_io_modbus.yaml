plc_io_modbus:
  ros__parameters:
    # LAN1 数字量模块：MT3A-IO1632，MAC 84:B3:B6:E0:A5:A8，16 DI / 16 DO。
    # 红外激光接 DI，真空泵继电器接 DO。
    digital:
      module:
        host: "192.168.1.12"  # LAN1 上 DI/DO 模块自身 IP
        port: 502
        unit_id: 1
      inputs:
        infrared_laser:
          di_address: 0  # FC02 离散输入地址；待现场确认
      outputs:
        vacuum_pump_relay:
          # FC05/FC01 线圈地址：1=继电器吸合并启动泵，0=停止泵并释放。
          do_address: 0

    # LAN3 模拟量模块：MT3A-AE0830，8 AI；当前只读取 AI，不使用 AO。
    analog:
      module:
        host: "192.168.1.13"  # LAN3 上 AI 模块自身 IP
        port: 502
        unit_id: 1
      inputs:
        vacuum_sensor:
          # AE0830 CH0：FC04、寄存器 0、16 位无符号数，原始单位为 1 mV。
          register: 0

          # ZSE30A 真空型模拟电压输出：1 V=0 kPa，5 V=-101 kPa。
          # 换算：pressure_kpa = (raw_mV - 1000) * (-101) / (5000 - 1000)。
          raw_at_zero_kpa: 1000.0
          raw_at_full_scale: 5000.0
          full_scale_kpa: -101.0

          # 超出有效范围仍发布数据，但 valid=false；0 V 断线不会被判为释放成功。
          valid_raw_min: 800
          valid_raw_max: 5200

          # 压力小于或等于该值时判定已吸牢。
          attached_threshold_kpa: -80.0
          # 压力恢复到 0 kPa 才判定 RELEASE 成功。
          released_threshold_kpa: 0.0

    poll_period: 0.2  # 轮询周期（秒），依次读取激光 DI、泵 DO 和真空 AI

# 下列 /plc/* 是 RT-Control 内部硬件接口，公共调用仍使用
# /vacuum/pump/set_enabled 和 /vacuum/grip。
# /plc/vacuum_pump：std_srvs/srv/SetBool（唯一继电器输出）
# /plc/io_state：rt_control_interfaces/msg/PlcIoState
# /plc_io/vacuum_sensor：plc_io_modbus/msg/VacuumSensorState，持续发布
# header.stamp 为 Modbus 响应接收时间；pressure_kpa 单位 kPa；valid 表示本帧有效
# /plc_io/infrared_laser：std_msgs/msg/Bool，发布激光开关量
# 注意：FC05 回复成功只表示模块接受命令，不能证明继电器和真空泵实际动作。
