swerve_driver:
  ros__parameters:
    can:
      interface: vcan0
      feedback_deadline_us: 4000
      write_timeout_register: false
      timeout_register_ms: 100

    control:
      rate_hz: 100.0
      realtime_priority: 0
      cmd_vel_timeout_s: 0.25
      hold_steer_on_timeout: true

    # Placeholder geometry. Replace every value here during calibration.
    chassis:
      wheelbase_m: 0.5
      track_m: 0.4
      wheel_radius_m: 0.1
      max_wheel_speed_mps: 2.0
      max_linear_speed_mps: 1.5
      max_angular_speed_radps: 3.0
      max_wheel_acceleration_mps2: 3.0
      velocity_deadband_mps: 0.01
      align_threshold_rad: 0.349

    limits_fallback:
      p_max: 12.5
      v_max: 30.0
      t_max: 10.0

    steering:
      gear_ratio: 1.0
      kp: 30.0
      kd: 1.0
      kff_omega: 0.9
      max_ff_speed_radps: 3.0
      zero_offset_rad: [0.0, 0.0, 0.0, 0.0]
      invert: [false, false, false, false]

    drive:
      gear_ratio: 1.0
      kd: 2.0
      ks: 0.1
      kv: 1.0
      ka: 0.1
      invert: [false, false, false, false]

    motors:
      steering_esc_id: [1, 2, 3, 4]
      steering_mst_id: [17, 18, 19, 20]
      drive_esc_id: [5, 6, 7, 8]
      drive_mst_id: [21, 22, 23, 24]

    safety:
      feedback_silent_cycles: 50
      reenable_period_s: 1.0

    odometry:
      imu_topic: /imu/data
      imu_timeout_s: 0.2
      publish_tf: true
      odom_frame: odom
      base_frame: base_link
      publish_rate_hz: 50.0
