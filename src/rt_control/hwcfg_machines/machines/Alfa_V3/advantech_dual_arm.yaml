        ring_position: 22
        mode_of_operation: 8
        robot_model_joint: right_joint4
        encoder_policy: single_turn
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      - physical_joint: J5
        ring_position: 23
