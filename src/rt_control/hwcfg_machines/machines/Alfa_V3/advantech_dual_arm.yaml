        mode_of_operation: 8
        robot_model_joint: left_joint6
        csp_profile: zeroerr_cia402_csp_torque_sensor
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      - physical_joint: J7
        ring_position: 17
        mode_of_operation: 8
        robot_model_joint: left_joint7
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      esc_ring_position: 10
    right:
      connector: sub-coupler port 1
      main_esc_port: 1
      axes:
      - physical_joint: J1
        ring_position: 19
        mode_of_operation: 8
        robot_model_joint: right_joint1
