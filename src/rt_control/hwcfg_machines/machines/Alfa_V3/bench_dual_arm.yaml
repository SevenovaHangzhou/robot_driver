schema_version: 1
kind: machine_module
status: draft
verified: true
authorities:
  source: bench_left_arm.yaml (left branch) + arms.yaml right branch + read-only EtherCAT scan 2026-10-22 (ar-Default-string)
  topology: cached SII/ports 2026-10-24 - X2/port3 -> left1..7 -> BluePoint8; X3/port1 -> right9..15 -> BluePoint16; port2 -> sub-coupler17
  ring_order: user-confirmed right J1..J7 order retained; BluePoint insertion shifts right J1..J7 from8..14 to9..15
  encoder_policy: user 2026-10-24 confirms right J3/J4 single-turn; 0x730F may be reset at disabled startup
  direction: left confirmed 2026-10-18; right all +1 confirmed by user per joint 2026-10-22; direction unchanged by ring migration
pending_facts:
- BluePoint sensors at rings8/16 are topology-only; force PDO/driver integration deferred
- right arm drive firmware (torque-sensor PDO not yet verified on the right drives)
- 'PP Halt policy: live firmware has no 0x605D object'
- measured nonwrapping single-turn travel for left J3 and right J3/J4 (single-turn use confirmed by user)
- coupler runtime state/DC and ESI display-version difference
robot_variant: Alfa_V3
module: bench_dual_arm
master_system: ecat_arms
# Bench assembly of both seven-axis arms without grippers: left on the main coupler X2,
# right on X3. BluePoint sensors are passive tails at8/16; sub-coupler is17.
spec:
  family: zeroerr
  extra_responders:
  - ring_position: 0
    profile: inovance_gr10_coupler
    identity_key: coupler_main
  - ring_position: 8
    profile: bench_arms_observers
    identity_key: bluepoint_p140000100
  - ring_position: 16
