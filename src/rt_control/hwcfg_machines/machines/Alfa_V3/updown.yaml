schema_version: 1
kind: machine_module
status: draft
verified: true
authorities:
  source: user 2026-11-22 (ELECTRI-242); Advantech read-only scan 2026-11-22 (ring 1, XMC_ESC 0x34e:0x445566)
  transmission: user 2026-11-22 - lead screw 10 mm with a 1:2 timing belt, so 5 mm per motor turn
  stroke: user 2026-11-23 - stroke ends in the calibrated joint coordinate (zero unchanged) are -1.033 m
    (2 cm above the bottom hard stop) and +0.017 m (top), 1.05 m in total; hard stops 2 cm beyond each
    end. Supersedes the user 2026-11-22 range -1.05..0 m (tape-measured zero)
  direction: user 2026-11-22 - motor positive moves the carriage up, the model's +q
  velocity: user 2026-11-22 - at most 2000 r/min; 0.1666 m/s = 1999.2 r/min (0x607F 19992 in 0.1 r/min),
    matching the Robot Model limit
  mode: user 2026-11-22 - CSP inside the arms' 15-axis trajectory controller
  brake: user 2026-11-22 - multi-turn absolute encoder that keeps its position without power; the brake
    engages on power loss
pending_facts:
- brake behaviour on disable and on communication loss, to be observed on the robot
- enabled direction check with a small move before the full stroke
robot_variant: Alfa_V3
module: updown
