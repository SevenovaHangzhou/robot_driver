# Bench assembly scopes of the Alfa_V3 manifest; merged into `scopes` by integ_composer read_manifest().
scopes:
  bench_left_arm_stationary_enable:
    enabled_modules:
    - bench_left_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_left_arm
      mode_group: csp
    jtc_groups: []
    global_readiness: partial_scope
    # User decision 2026-10-17: the bench scope runs the 1 kHz main cycle (no BQ-154 override).
    render_mode: stationary_enable
    policies:
    - enable
    policy_overrides:
      enable: bench_left_arm_enable
    staged_hardware_activation: true
    controller_order:
      inactive: []
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  # Single-arm bench motion: the operator console sends FollowJointTrajectory goals to
  # left_arm_jtc after enable. Real mode stays fail-closed until the axis directions are verified.
  bench_left_arm:
    enabled_modules:
    - bench_left_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_left_arm
      mode_group: csp
    jtc_groups:
    - module: bench_left_arm
      mode_group: csp
    global_readiness: partial_scope
    render_mode: normal
    policies:
    - enable
    - motion
    policy_overrides:
      enable: bench_left_arm_enable
      motion: bench_left_arm_motion
    staged_hardware_activation: true
    controller_order:
      inactive:
      - left_arm_jtc
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  bench_dual_arm_stationary_enable:
    enabled_modules:
    - bench_dual_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_dual_arm
      mode_group: csp
    jtc_groups: []
    global_readiness: partial_scope
    render_mode: stationary_enable
    policies:
    - enable
    policy_overrides:
      enable: bench_dual_arm_enable
    staged_hardware_activation: true
    controller_order:
      inactive: []
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  # Dual-arm bench motion: the operator console sends 14-joint FollowJointTrajectory goals to
  # dual_arm_jtc after enable. The right arm directions are provisional until checked per joint.
  bench_dual_arm:
    enabled_modules:
    - bench_dual_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_dual_arm
      mode_group: csp
    jtc_groups:
    - module: bench_dual_arm
      mode_group: csp
    global_readiness: partial_scope
    render_mode: normal
    policies:
    - enable
    - motion
    policy_overrides:
      enable: bench_dual_arm_enable
      motion: bench_dual_arm_motion
    staged_hardware_activation: true
    controller_order:
      inactive:
      - dual_arm_jtc
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  bench_right_arm_stationary_enable:
    enabled_modules:
    - bench_right_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_right_arm
      mode_group: csp
    jtc_groups: []
    global_readiness: partial_scope
    render_mode: stationary_enable
    policies:
    - enable
    policy_overrides:
      enable: bench_right_arm_enable
    staged_hardware_activation: true
    controller_order:
      inactive: []
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  bench_right_arm:
    enabled_modules:
    - bench_right_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_right_arm
      mode_group: csp
    jtc_groups:
    - module: bench_right_arm
      mode_group: csp
    global_readiness: partial_scope
    render_mode: normal
    policies:
    - enable
    - motion
    policy_overrides:
      enable: bench_right_arm_enable
      motion: bench_right_arm_motion
    staged_hardware_activation: true
    controller_order:
      inactive:
      - right_arm_jtc
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
