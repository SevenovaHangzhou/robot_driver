# scopes of the Alfa_V3 manifest; merged by integ_composer read_manifest() via manifest.yaml parts.
scopes:
  arms_only:
    enabled_modules:
    - arms
    required_state_modules: []
    actuator_groups:
    - module: arms
      mode_group: csp
    jtc_groups:
    - module: arms
      mode_group: csp
    global_readiness: partial_scope
    render_mode: normal
    policies:
    - enable
    - motion
    controller_order:
      inactive:
      - whole_body_jtc
      - rolling_trajectory_controller
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
    jtc_only_excluded:
    - rolling_trajectory_controller
    staged_hardware_activation: true
    publish_robot_state: true
  arms_updown:
    enabled_modules:
    - arms
    - updown
    required_state_modules: []
    actuator_groups:
    - module: arms
      mode_group: csp
    - module: updown
      mode_group: csp
    jtc_groups:
    - module: arms
      mode_group: csp
    - module: updown
      mode_group: csp
    global_readiness: partial_scope
  chassis_only:
    enabled_modules:
    - swerve_chassis
    - swerve_encoders
    required_state_modules:
    - swerve_encoders
    actuator_groups:
    - module: swerve_chassis
      mode_group: steering_csp
    - module: swerve_chassis
      mode_group: drive_csv
    jtc_groups: []
    global_readiness: partial_scope
    render_mode: normal
    controller_order:
      inactive:
      - swerve_controller
      active:
      - joint_state_broadcaster
      - enable_manager
    controller_parameter_bindings:
      swerve_controller:
        instance_order: [module_1, module_2, module_3, module_4]
        parameters:
          steering_joints:
            module: swerve_chassis
            export: steering_joints
            resource_kind: joints
          drive_joints:
            module: swerve_chassis
            export: drive_joints
            resource_kind: joints
          steering_encoders:
            module: swerve_encoders
            export: steering_encoders
            resource_kind: sensors
          module_x:
            module: swerve_chassis
            export: module_x
          module_y:
            module: swerve_chassis
            export: module_y
          wheel_radius:
            module: swerve_chassis
            export: wheel_radius
          steering_to_yaw_sign:
            module: swerve_chassis
            export: steering_to_yaw_sign
          calibration_verified:
            module: swerve_chassis
            export: calibration_verified
    policies:
    - enable
    policy_overrides:
      enable: chassis_enable
    staged_hardware_activation: true
    mock_robot_model:
      package: hwcfg_machines
      xacro_file: machines/Alfa_V3/chassis.mock.urdf
      joint_limits_file: machines/Alfa_V3/chassis.mock.limits.yaml
  full:
    enabled_modules:
    - arms
    - updown
    - swerve_chassis
    - swerve_encoders
    - active_suspension
    - head_gimbal
    required_state_modules:
    - swerve_encoders
    actuator_groups:
    - module: arms
      mode_group: csp
    - module: updown
      mode_group: csp
    - module: swerve_chassis
      mode_group: steering_csp
    - module: swerve_chassis
      mode_group: drive_csv
    - module: active_suspension
      mode_group: csp
    - module: head_gimbal
      mode_group: position_velocity
    jtc_groups:
    - module: arms
      mode_group: csp
    - module: updown
      mode_group: csp
    global_readiness: full_scope
  head_only:
    enabled_modules:
    - head_gimbal
    required_state_modules: []
    actuator_groups:
    - module: head_gimbal
      mode_group: position_velocity
    jtc_groups: []
    global_readiness: partial_scope
    render_mode: normal
    policies: []
    controller_order:
      inactive:
      - head_position_controller
      active:
      - joint_state_broadcaster
      - enable_manager
    controller_file:
      package: hwcfg_machines
      file: machines/Alfa_V3/head_controllers.yaml
    controller_parameter_bindings:
      joint_state_broadcaster:
        parameters:
          joints:
            module: head_gimbal
            export: joint_names
            resource_kind: joints
      head_position_controller:
        parameters:
          joints:
            module: head_gimbal
            export: joint_names
            resource_kind: joints
      enable_manager:
        parameters:
          handshake_devices:
            module: head_gimbal
            export: handshake_devices
            resource_kind: gpios
          diagnostic_joints:
            module: head_gimbal
            export: joint_names
            resource_kind: joints
    robot_name: alfa_v3_head_control
    parameter_view: head_state
    staged_hardware_activation: true
    publish_robot_state: true
  arms_stationary_enable:
    enabled_modules:
    - arms
    required_state_modules: []
    actuator_groups:
    - module: arms
      mode_group: csp
    jtc_groups:
    - module: arms
      mode_group: csp
    global_readiness: partial_scope
    ethercat_cycle_hz_override: 250
    bq_ref: BQ-154
    render_mode: stationary_enable
    policies:
    - enable
    controller_order:
      inactive: []
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
    staged_hardware_activation: true
  bench_left_arm_stationary_enable:
    enabled_modules:
    - bench_left_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_left_arm
      mode_group: csp
    jtc_groups: []
    global_readiness: partial_scope
    # User decision 2026-10-17: the bench scope runs the 1 kHz main cycle (no BQ-154 override).
    render_mode: stationary_enable
    policies:
    - enable
    policy_overrides:
      enable: bench_left_arm_enable
    staged_hardware_activation: true
    controller_order:
      inactive: []
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  # Single-arm bench motion: the operator console sends FollowJointTrajectory goals to
  # left_arm_jtc after enable. Real mode stays fail-closed until the axis directions are verified.
  bench_left_arm:
    enabled_modules:
    - bench_left_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_left_arm
      mode_group: csp
    jtc_groups:
    - module: bench_left_arm
      mode_group: csp
    global_readiness: partial_scope
    render_mode: normal
    policies:
    - enable
    - motion
    policy_overrides:
      enable: bench_left_arm_enable
      motion: bench_left_arm_motion
    staged_hardware_activation: true
    controller_order:
      inactive:
      - left_arm_jtc
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  bench_dual_arm_stationary_enable:
    enabled_modules:
    - bench_dual_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_dual_arm
      mode_group: csp
    jtc_groups: []
    global_readiness: partial_scope
    render_mode: stationary_enable
    policies:
    - enable
    policy_overrides:
      enable: bench_dual_arm_enable
    staged_hardware_activation: true
    controller_order:
      inactive: []
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  # Dual-arm bench motion: the operator console sends 14-joint FollowJointTrajectory goals to
  # dual_arm_jtc after enable. The right arm directions are provisional until checked per joint.
  bench_dual_arm:
    enabled_modules:
    - bench_dual_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_dual_arm
      mode_group: csp
    jtc_groups:
    - module: bench_dual_arm
      mode_group: csp
    global_readiness: partial_scope
    render_mode: normal
    policies:
    - enable
    - motion
    policy_overrides:
      enable: bench_dual_arm_enable
      motion: bench_dual_arm_motion
    staged_hardware_activation: true
    controller_order:
      inactive:
      - dual_arm_jtc
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  force_bench:
    enabled_modules:
    - wrist_force_sensors
    required_state_modules: []
    actuator_groups: []
    jtc_groups: []
    global_readiness: partial_scope
    render_mode: normal
    policies: []
    hardware_system_id: bluepoint_raw_bench
    minimal_robot:
      name: bluepoint_raw_bench
      base_link: force_bench_base
    controller_order:
      inactive: []
      active:
      - left_wrist_force_sensor_broadcaster
      - right_wrist_force_sensor_broadcaster
    staged_hardware_activation: true
  bench_right_arm_stationary_enable:
    enabled_modules:
    - bench_right_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_right_arm
      mode_group: csp
    jtc_groups: []
    global_readiness: partial_scope
    render_mode: stationary_enable
    policies:
    - enable
    policy_overrides:
      enable: bench_right_arm_enable
    staged_hardware_activation: true
    controller_order:
      inactive: []
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
  bench_right_arm:
    enabled_modules:
    - bench_right_arm
    required_state_modules: []
    actuator_groups:
    - module: bench_right_arm
      mode_group: csp
    jtc_groups:
    - module: bench_right_arm
      mode_group: csp
    global_readiness: partial_scope
    render_mode: normal
    policies:
    - enable
    - motion
    policy_overrides:
      enable: bench_right_arm_enable
      motion: bench_right_arm_motion
    staged_hardware_activation: true
    controller_order:
      inactive:
      - right_arm_jtc
      active:
      - joint_state_broadcaster
      - rt_internal_state_broadcaster
      - enable_manager
