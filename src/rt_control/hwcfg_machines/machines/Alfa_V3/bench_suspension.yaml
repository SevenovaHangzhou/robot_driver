  profile: tongyi_xmc_esc
  identity_key: xmc_esc
  metres_per_motor_turn: 0.02
  stroke_min_m: 0.0
  stroke_max_m: 0.18
  hard_stop_margin_m: 0.0025
  max_velocity_m_s: 0.03
  profile_acceleration_ms_per_krpm: 5556
  profile_deceleration_ms_per_krpm: 5556
  axes:
