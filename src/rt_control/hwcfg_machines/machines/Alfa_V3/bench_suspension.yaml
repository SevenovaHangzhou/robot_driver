schema_version: 1
kind: machine_module
status: draft
verified: false
authorities:
  source: user 2026-11-17/18 (ELECTRI-224); .40 read-only scan 2026-11-17
  transmission: user 2026-11-17 2:1 reduction; lead corrected by the user 2026-11-18 to 40 mm, so 20 mm per motor turn
  stroke: user 2026-11-17 - 0..180 mm, zero at the bottom, hard stops 2.5 mm beyond each end
  direction: user 2026-11-18 - joint +Z up, the motor's positive direction is down
  velocity: user 2026-11-17 - at most 30 mm/s (0x607F = 900 in 0.1 r/min at 20 mm per turn)
  acceleration: user 2026-11-18 - trapezoid, 0.5 s from 0 to 30 mm/s (90 r/min), so 0x6083/0x6084 = 5556 ms per 1000 r/min
pending_facts:
- vendor factory defaults kept (user 2026-11-18); brake and communication-loss behaviour to be verified on the bench
- mechanical zero capture at the bottom of the stroke (bench_suspension_zero.yaml)
robot_variant: Alfa_V3
module: bench_suspension
master_system: ecat_suspension
# Bench test of the active-suspension drive behind the sub-coupler of the arms' master (ring 18).
# The arm drives, BluePoint sensors and couplers stay passive responders: the arms stack and this
# one cannot run at the same time.
