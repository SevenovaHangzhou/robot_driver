# Part of controllers.yaml (merged by integ_composer read_with_parts): arm trajectory controllers.
controllers:
  whole_body_jtc:
    module: arms
    name: whole_body_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - trajectory
    - motion
    - enable_target
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: jtc
    - interface:
        name: arms_trajectory
        as: action_name
    - interface:
        name: arms_joint_stream
        as: trajectory_topic
    - model_limits:
        policy: motion
        path: joints
        attribute: velocity
        as: joint_velocity_limits
    - model_limits:
        policy: motion
        path: joints
        attribute: acceleration
        as: joint_acceleration_limits
  # Seven-axis bench arm trajectory controller; the operator console is its client.
  left_arm_jtc:
    module: bench_left_arm
    name: left_arm_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - trajectory
    - motion
    - enable_target
    capabilities:
    - name: arm_joint_trajectory
      topic: /rt/arms/left/follow_joint_trajectory
      type: control_msgs/action/FollowJointTrajectory
    - name: arm_joint_stream
      topic: /rt/arms/left/joint_trajectory
      type: trajectory_msgs/msg/JointTrajectory
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: jtc
    - interface:
        name: left_arm_trajectory
        as: action_name
    - interface:
        name: left_arm_joint_stream
        as: trajectory_topic
    - model_limits:
        policy: motion
        path: joints
        attribute: velocity
        as: joint_velocity_limits
    - model_limits:
        policy: motion
        path: joints
        attribute: acceleration
        as: joint_acceleration_limits
  # Both bench arms in one trajectory controller; the operator console is its client.
  dual_arm_jtc:
    module: bench_dual_arm
    name: dual_arm_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - trajectory
    - motion
    - enable_target
    capabilities:
    - name: arm_joint_trajectory
      topic: /rt/arms/follow_joint_trajectory
      type: control_msgs/action/FollowJointTrajectory
    - name: arm_joint_stream
      topic: /rt/arms/joint_trajectory
      type: trajectory_msgs/msg/JointTrajectory
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: jtc
    - interface:
        name: arms_trajectory
        as: action_name
    - interface:
        name: arms_joint_stream
        as: trajectory_topic
    - model_limits:
        policy: motion
        path: joints
        attribute: velocity
        as: joint_velocity_limits
    - model_limits:
        policy: motion
        path: joints
        attribute: acceleration
        as: joint_acceleration_limits
  rolling_trajectory_controller:
    module: arms
    name: rolling_trajectory_controller
    plugin: ctrl_rolling_trajectory/RollingTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - rolling
    - motion
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: rolling
    - model_limits:
        policy: motion
        path: joints
        attribute: lower
        as: joint_position_lower
    - model_limits:
        policy: motion
        path: joints
        attribute: upper
        as: joint_position_upper
    - model_limits:
        policy: motion
        path: joints
        attribute: velocity
        as: joint_velocity_limits
    - model_limits:
        policy: motion
        path: joints
        attribute: acceleration
        as: joint_acceleration_limits
  # Both bench arms under rolling; enable_manager switches between it and dual_arm_jtc.
  dual_arm_rolling:
    module: bench_dual_arm
    name: dual_arm_rolling
    plugin: ctrl_rolling_trajectory/RollingTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - rolling
    - motion
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: rolling
    - model_limits:
        policy: motion
        path: joints
        attribute: lower
        as: joint_position_lower
    - model_limits:
        policy: motion
        path: joints
        attribute: upper
        as: joint_position_upper
    - model_limits:
        policy: motion
        path: joints
        attribute: velocity
        as: joint_velocity_limits
    - model_limits:
        policy: motion
        path: joints
        attribute: acceleration
        as: joint_acceleration_limits
  right_arm_jtc:
    module: bench_right_arm
    name: right_arm_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - trajectory
    - motion
    - enable_target
    capabilities:
    - name: arm_joint_trajectory
      topic: /rt/arms/right/follow_joint_trajectory
      type: control_msgs/action/FollowJointTrajectory
    - name: arm_joint_stream
      topic: /rt/arms/right/joint_trajectory
      type: trajectory_msgs/msg/JointTrajectory
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: jtc
    - interface:
        name: right_arm_trajectory
        as: action_name
    - interface:
        name: right_arm_joint_stream
        as: trajectory_topic
    - model_limits:
        policy: motion
        path: joints
        attribute: velocity
        as: joint_velocity_limits
    - model_limits:
        policy: motion
        path: joints
        attribute: acceleration
        as: joint_acceleration_limits
