# Bench enable policy of the active-suspension drive: one axis, one batch. Timing follows the
# arm bench policies; enable_manager activates the command controller once the axis is enabled.
disable_terminal_policy: switch_on_disabled
batch_timeout: 4.0
disable_stage_timeout: 4.0
fault_reset_timeout: 4.0
inter_batch_delay: 0.2
controller_switch_timeout: 4.0
service_result_timeout_ms: 90000
enable_groups:
- module: bench_suspension
  mode_group: pp
  batch_size: 1
ready_to_switch_on_disable_terminal_joints: []
runtime_views:
  stationary_enable:
    parameter_names:
    - disable_terminal_policy
    - batch_timeout
    - disable_stage_timeout
    - fault_reset_timeout
    - inter_batch_delay
    - controller_switch_timeout
    - service_result_timeout_ms
