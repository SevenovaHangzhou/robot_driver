# Whole-robot arm enable policy: one joint per batch in bus order. Joints (normal and
# stationary-enable names alike) come from the rendered arms module.
disable_terminal_policy: switch_on_disabled
batch_timeout: 4.0
disable_stage_timeout: 4.0
fault_reset_timeout: 4.0
inter_batch_delay: 0.2
controller_switch_timeout: 4.0
service_result_timeout_ms: 90000
enable_groups:
- module: arms
  mode_group: csp
  batch_size: 1
ready_to_switch_on_disable_terminal_joints: []
runtime_views:
  normal:
    enable_only: false
    parameter_names:
    - disable_terminal_policy
    - batch_timeout
    - disable_stage_timeout
    - fault_reset_timeout
    - inter_batch_delay
    - controller_switch_timeout
    - service_result_timeout_ms
  stationary_enable:
    enable_only: true
    parameter_names:
    - disable_terminal_policy
    - batch_timeout
    - disable_stage_timeout
    - fault_reset_timeout
    - inter_batch_delay
    - service_result_timeout_ms
