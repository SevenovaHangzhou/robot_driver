# Advantech full-machine enable policy (ELECTRI-239, user 2026-11-22): one enable request brings up
# the chassis, the lift, both arms joint by joint, then the head handshake; any failure rolls all
# back. Timing values are the exercised chassis and arm values; the result timeout covers the 19
# batches. Software emergency-stop response stays off in the first version (hardware e-stop only).
emergency_stop_response: false
disable_terminal_policy: switch_on_disabled
batch_timeout: 4.0
disable_stage_timeout: 4.0
fault_reset_timeout: 4.0
inter_batch_delay: 0.2
controller_switch_timeout: 4.0
service_result_timeout_ms: 90000
# Required state sources (the steering encoders) must stay ready this long first.
ready_hold_time: 0.05
enable_groups:
- module: swerve_chassis
  mode_group: steering_csp
  batch_size: 2
- module: swerve_chassis
  mode_group: drive_csv
  batch_size: 2
- module: updown
  mode_group: csp
  batch_size: 1
# The ZeroErr drives map no mode display (0x6061): their startup mode is not confirmed.
- module: advantech_dual_arm
  mode_group: csp
  batch_size: 1
  mode_confirmation: none
mode_confirmation: startup
ready_to_switch_on_disable_terminal_joints: []
runtime_views:
  normal:
    parameter_names:
    - disable_terminal_policy
    - batch_timeout
    - disable_stage_timeout
    - fault_reset_timeout
    - inter_batch_delay
    - controller_switch_timeout
    - service_result_timeout_ms
    - ready_hold_time
