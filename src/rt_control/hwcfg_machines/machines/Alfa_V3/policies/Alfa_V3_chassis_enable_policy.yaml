# Chassis enable policy: batches by module and mode group; joints and fixed startup modes
# come from the rendered composition. Timing values are the exercised Advantech bench values.
disable_terminal_policy: switch_on_disabled
batch_timeout: 4.0
disable_stage_timeout: 4.0
fault_reset_timeout: 4.0
inter_batch_delay: 0.2
controller_switch_timeout: 4.0
service_result_timeout_ms: 30000
# Required state sources (scope required_state_modules) must stay ready this long first.
ready_hold_time: 0.05
enable_groups:
- module: swerve_chassis
  mode_group: steering_csp
  batch_size: 2
- module: swerve_chassis
  mode_group: drive_csv
  batch_size: 2
mode_confirmation: startup
ready_to_switch_on_disable_terminal_joints: []
runtime_views:
  normal:
    parameter_names:
    - disable_terminal_policy
    - batch_timeout
    - disable_stage_timeout
    - fault_reset_timeout
    - inter_batch_delay
    - controller_switch_timeout
    - service_result_timeout_ms
    - ready_hold_time
