# Advantech arms group motion policy (ELECTRI-239, user 2026-11-22): the 15-axis trajectory
# controller (both arms, then the lift, sent as one goal) and the arms group's standstill check.
# Arm values equal Alfa_V3_bench_dual_arm_motion.yaml (the same arms). Lift values (m, m/s) are
# provisional until checked on the robot: start tolerance 5 mm, standstill 2 mm/s, takeover 2 mm.
mode_service: arms_control_mode
joints:
- right_joint1
- right_joint2
- right_joint3
- right_joint4
- right_joint5
- right_joint6
- right_joint7
- left_joint1
- left_joint2
- left_joint3
- left_joint4
- left_joint5
- left_joint6
- left_joint7
- updown
jtc:
  command_interfaces:
  - position
  state_interfaces:
  - position
  allow_partial_joints_goal: false
  allow_nonzero_velocity_at_trajectory_end: false
  open_loop_control: true
  set_last_command_interface_value_as_state_on_activation: false
  trajectory_start_consistency_check:
    enabled: true
    position_tolerances:
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.017453292519943295
    - 0.005
    feedback_age_state_interface: ethercat_domain/process_data_age_ms
    max_feedback_age_ms: 500.0
  state_publish_rate: 50.0
  constraints:
    goal_time: 0.5
    stopped_velocity_tolerance: 0.01
enable_manager:
  mode_switch_source_state_max_age_ms: 100
  mode_switch_stable_interval_count: 20
  mode_switch_maximum_sample_period_ms: 2
  mode_switch_timeout_ms: 500
  mode_switch_feedback_age_limit_ms: 500.0
  mode_switch_stable_velocity_thresholds:
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.002
  mode_switch_takeover_tolerances:
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
  - 0.008726646259971648
