    profile: inovance_gr10_coupler
    identity_key: coupler_subdevice
  branches:
    left:
      connector: X2
      main_esc_port: 3
      axes:
      - physical_joint: J1
        ring_position: 1
        mode_of_operation: 8
        robot_model_joint: left_joint1
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      - physical_joint: J2
        ring_position: 2
        mode_of_operation: 8
        robot_model_joint: left_joint2
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      - physical_joint: J3
        ring_position: 3
        mode_of_operation: 8
        robot_model_joint: left_joint3
        # User-confirmed 18ET model; independent raw output torque feedback.
        csp_profile: zeroerr_cia402_csp_torque_sensor
        encoder_policy: single_turn
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      - physical_joint: J4
        ring_position: 4
        mode_of_operation: 8
        robot_model_joint: left_joint4
        # User-confirmed 18ET model; independent raw output torque feedback.
        csp_profile: zeroerr_cia402_csp_torque_sensor
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      - physical_joint: J5
        ring_position: 5
        mode_of_operation: 8
        robot_model_joint: left_joint5
        # User-confirmed 18ET model; independent raw output torque feedback.
        csp_profile: zeroerr_cia402_csp_torque_sensor
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      - physical_joint: J6
        ring_position: 6
        mode_of_operation: 8
        robot_model_joint: left_joint6
        # User-confirmed 18ET; dual-encoder calculated torque and raw difference.
        csp_profile: zeroerr_cia402_csp_torque_encoder
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
      - physical_joint: J7
        ring_position: 7
        mode_of_operation: 8
        robot_model_joint: left_joint7
        device: devices/zeroerr_erob_model_tbd.yaml
        direction: 1
  drive_profiles:
    # Diagnostic feedback (velocity, torque, error code) for the Runtime-LOG black box (2026-10-19).
    csp: zeroerr_cia402_csp_diag
    gripper_pp: zeroerr_cia402_stationary
