schema_version: 1
kind: controllers
status: draft
verified: false
authorities:
  source: rt_control_bringup/config/machines/alfa_v3.yaml + config/alfa_v3_grippers.draft.yaml
pending_facts: []
robot_variant: Alfa_V3
controllers:
  swerve_chassis:
    module: swerve_chassis
    name: swerve_controller
    plugin: swerve_driver/SwerveController
    package: swerve_driver
    config_file: config/controller.draft.yaml
    actuator_groups:
    - steering_csp
    - drive_csv
    required_state_modules:
    - swerve_encoders
    role: motion
  head_gimbal:
    module: head_gimbal
    name: damiao_head_manager
    plugin: damiao_head_controller/HeadManagerController
    package: damiao_head_controller
    config_file: config/controllers.yaml
    actuator_groups:
    - position_velocity
    required_state_modules: []
    role: external
  left_gripper:
    module: arms
    name: left_gripper_controller
    plugin: forward_command_controller/ForwardCommandController
    package: control_api_adapter
    config_file: config/Alfa_V3_grippers.draft.yaml
    actuator_groups:
    - gripper_pp
    required_state_modules: []
  right_gripper:
    module: arms
    name: right_gripper_controller
    plugin: forward_command_controller/ForwardCommandController
    package: control_api_adapter
    config_file: config/Alfa_V3_grippers.draft.yaml
    actuator_groups:
    - gripper_pp
    required_state_modules: []
  whole_body_jtc:
    module: arms
    name: whole_body_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: rolling_trajectory_controller
    config_file: config/Alfa_V3_arm_tolerances.yaml
    actuator_groups:
    - csp
    required_state_modules: []
    role: trajectory
  rolling_trajectory_controller:
    module: arms
    name: rolling_trajectory_controller
    plugin: rolling_trajectory_controller/RollingTrajectoryController
    package: rolling_trajectory_controller
    config_file: config/Alfa_V3_arm_tolerances.yaml
    actuator_groups:
    - csp
    required_state_modules: []
    role: rolling
  enable_manager:
    module: arms
    name: enable_manager
    plugin: enable_manager/EnableManagerController
    package: enable_manager
    config_file: config/Alfa_V3_enable_policy.yaml
    actuator_groups:
    - csp
    - gripper_pp
    required_state_modules: []
    role: enable
  joint_state_broadcaster:
    module: arms
    name: joint_state_broadcaster
    plugin: joint_state_broadcaster/JointStateBroadcaster
    package: rt_control_composer
    config_file: config/controller_defaults.yaml
    actuator_groups:
    - csp
    - gripper_pp
    required_state_modules: []
    role: joint_state
  rt_internal_state_broadcaster:
    module: arms
    name: rt_internal_state_broadcaster
    plugin: joint_state_broadcaster/JointStateBroadcaster
    package: rt_control_composer
    config_file: config/controller_defaults.yaml
    actuator_groups:
    - csp
    - gripper_pp
    required_state_modules: []
    role: internal_state
  head_head_position_controller:
    module: head_gimbal
    name: head_position_controller
    plugin: forward_command_controller/ForwardCommandController
    package: damiao_head_controller
    config_file: config/controllers.yaml
    actuator_groups:
    - position_velocity
    required_state_modules: []
    role: external
  left_wrist_force_sensor_broadcaster:
    module: wrist_force_sensors
    name: left_wrist_force_sensor_broadcaster
    plugin: rt_force_torque_broadcaster/ForceTorqueBroadcaster
    package: rt_force_torque_broadcaster
    config_file: config/force_bench.yaml
    actuator_groups: []
    required_state_modules: []
    role: sensor_broadcaster
  right_wrist_force_sensor_broadcaster:
    module: wrist_force_sensors
    name: right_wrist_force_sensor_broadcaster
    plugin: rt_force_torque_broadcaster/ForceTorqueBroadcaster
    package: rt_force_torque_broadcaster
    config_file: config/force_bench.yaml
    actuator_groups: []
    required_state_modules: []
    role: sensor_broadcaster
