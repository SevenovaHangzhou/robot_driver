schema_version: 1
kind: controllers
status: draft
verified: false
authorities:
  source: migrated from the removed rt_control_bringup/config/machines/alfa_v3.yaml (see git history)
pending_facts: []
robot_variant: Alfa_V3
controllers:
  swerve_chassis:
    module: swerve_chassis
    name: swerve_controller
    plugin: ctrl_swerve/SwerveController
    package: ctrl_swerve
    actuator_groups:
    - steering_csp
    - drive_csv
    required_state_modules:
    - swerve_encoders
    # Activated by enable_manager after every batch is confirmed; reports latched faults.
    tags:
    - enable_target
    - fault_reporting
    # Public operator capability provided while this controller is active.
    capabilities:
    - name: chassis_velocity
      topic: /cmd_vel
      type: geometry_msgs/msg/Twist
    parameters:
    - yaml:
        package: ctrl_swerve
        file: config/controller.draft.yaml
        path: '{controller}.ros__parameters'
  whole_body_jtc:
    module: arms
    name: whole_body_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - trajectory
    - motion
    - enable_target
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: jtc
  # Seven-axis bench arm trajectory controller; the operator console is its client.
  left_arm_jtc:
    module: bench_left_arm
    name: left_arm_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - trajectory
    - motion
    - enable_target
    capabilities:
    - name: arm_joint_trajectory
      topic: /left_arm_jtc/follow_joint_trajectory
      type: control_msgs/action/FollowJointTrajectory
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: jtc
  # Both bench arms in one trajectory controller; the operator console is its client.
  dual_arm_jtc:
    module: bench_dual_arm
    name: dual_arm_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - trajectory
    - motion
    - enable_target
    capabilities:
    - name: arm_joint_trajectory
      topic: /dual_arm_jtc/follow_joint_trajectory
      type: control_msgs/action/FollowJointTrajectory
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: jtc
  rolling_trajectory_controller:
    module: arms
    name: rolling_trajectory_controller
    plugin: ctrl_rolling_trajectory/RollingTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - rolling
    - motion
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: rolling
    - policy_file:
        name: envelope
        as: envelope_file
  enable_manager:
    module: arms
    name: enable_manager
    plugin: ctrl_enable_manager/EnableManagerController
    package: ctrl_enable_manager
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - enable
    parameters:
    - policy:
        name: enable
        overlay: runtime_views.{mode}
        keys_from: parameter_names
    - policy:
        name: enable
        overlay: runtime_views.{mode}
        path: managed_joints
        as: managed_joints
        match: managed_joints
        partition: enable_batches
    - policy:
        name: enable
        overlay: runtime_views.{mode}
        path: enable_batches
        transform: flatten
        as: enable_batch_joint_names
    - policy:
        name: enable
        overlay: runtime_views.{mode}
        path: enable_batches
        transform: lengths
        as: enable_batch_sizes
    - policy:
        name: enable
        path: runtime_views.{mode}.enable_only
        as: enable_only
    - controllers:
        tag: enable_target
        select: first
        default: ''
        as: jtc_name
    - policy:
        name: enable
        path: expected_modes
        as: expected_modes
        optional: true
    - state_ready:
        as: ready_state_interfaces
    - controllers:
        tag: fault_reporting
        select: first
        format: /{name}/fault_stop
        optional: true
        as: motion_fault_topic
    - when_policy: motion
      controllers:
        tag: rolling
        select: any
        as: motion_mode_switching
    - when_policy: motion
      controllers:
        tag: motion
        select: all
        as: motion_controller_names
    - when_policy: motion
      controllers:
        tag: trajectory
        select: first
        as: default_motion_controller
    - when_policy: motion
      controllers:
        tag: rolling
        select: first
        default: ''
        as: rolling_motion_controller
    - when_policy: motion
      policy:
        name: motion
        path: joints
        as: motion_joints
    - when_policy: motion
      policy:
        name: motion
        path: enable_manager
  joint_state_broadcaster:
    module: arms
    name: joint_state_broadcaster
    plugin: joint_state_broadcaster/JointStateBroadcaster
    package: rt_control_composer
    actuator_groups:
    - csp
    required_state_modules: []
    tags: []
    parameters:
    - yaml:
        package: rt_control_composer
        file: config/controller_defaults.yaml
        path: joint_state.{mode}
    - when_policy: motion
      policy:
        name: motion
        path: joints
        as: joints
  rt_internal_state_broadcaster:
    module: arms
    name: rt_internal_state_broadcaster
    plugin: joint_state_broadcaster/JointStateBroadcaster
    package: rt_control_composer
    actuator_groups:
    - csp
    required_state_modules: []
    tags: []
    parameters:
    - yaml:
        package: rt_control_composer
        file: config/controller_defaults.yaml
        path: internal_state.{mode}
  head_head_position_controller:
    module: head_gimbal
    name: head_position_controller
    plugin: forward_command_controller/ForwardCommandController
    package: forward_command_controller
    actuator_groups:
    - position_velocity
    required_state_modules: []
    tags: []
    parameters:
    - yaml:
        package: rt_control_machine_config
        file: machines/Alfa_V3/head_controllers.yaml
        path: '{controller}.ros__parameters'
  left_wrist_force_sensor_broadcaster:
    module: wrist_force_sensors
    name: left_wrist_force_sensor_broadcaster
    plugin: ctrl_force_torque_broadcaster/ForceTorqueBroadcaster
    package: ctrl_force_torque_broadcaster
    actuator_groups: []
    required_state_modules: []
    tags: []
    parameters:
    - owner_parameters: {}
    - topics:
        templates:
          wrench_topic: wrench
          raw_topic: raw
          sensor_state_topic: state
          diagnostic_name: sensor_calibration
          calibration_topic: family_calibration
    - runtime:
        key: startup_id
        as: startup_id
  right_wrist_force_sensor_broadcaster:
    module: wrist_force_sensors
    name: right_wrist_force_sensor_broadcaster
    plugin: ctrl_force_torque_broadcaster/ForceTorqueBroadcaster
    package: ctrl_force_torque_broadcaster
    actuator_groups: []
    required_state_modules: []
    tags: []
    parameters:
    - owner_parameters: {}
    - topics:
        templates:
          wrench_topic: wrench
          raw_topic: raw
          sensor_state_topic: state
          diagnostic_name: sensor_calibration
          calibration_topic: family_calibration
    - runtime:
        key: startup_id
        as: startup_id
  right_arm_jtc:
    module: bench_right_arm
    name: right_arm_jtc
    plugin: joint_trajectory_controller/JointTrajectoryController
    package: ctrl_rolling_trajectory
    actuator_groups:
    - csp
    required_state_modules: []
    tags:
    - trajectory
    - motion
    - enable_target
    capabilities:
    - name: arm_joint_trajectory
      topic: /right_arm_jtc/follow_joint_trajectory
      type: control_msgs/action/FollowJointTrajectory
    parameters:
    - policy:
        name: motion
        path: joints
        as: joints
        match: actuator_groups
    - policy:
        name: motion
        path: jtc
