unresolved_drawing_items:
  - Manufacturer must confirm the steering motor current and torque rows; the printed values are inconsistent with 400 W at 3000 rpm.
  - Manufacturer must provide the motor-to-steering-axis ratio; the confirmed 108/27 gearing belongs to the external encoder and must not be multiplied into the 35:1 motor reducer.
  - The drawing shows normally-open NPN left/right limit sensors but gives no steering hard-stop angles or zero datum.
  - The external encoder model, counts per revolution, distinguishable revolutions and installation direction are not specified.
  - Confirm the mounting reference diameter, clearance datum and the title-block mass value before production use.
  - The traction-weight value has no explicit unit in the drawing.
  - The grease row prints -20 to 200 degrees without an explicit temperature unit.

required_vehicle_calibration:
  - per-module loaded effective wheel radius
  - motor-derived steering zero offset
  - external encoder installation offset and direction
  - physical hard-stop angles, command margin and measurement tolerance
  - bidirectional steering backlash and repeatability
  - installed module coordinates and steering-axis-to-contact-patch offset
  - motor/external encoder disagreement threshold
  - steering slew, wheel acceleration and alignment thresholds
  - least-squares slip residual and odometry covariance scales
