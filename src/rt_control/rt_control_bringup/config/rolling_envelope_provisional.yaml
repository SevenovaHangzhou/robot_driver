  status: ESTIMATED_NOT_MEASURED
  estimation_method: >
    Position bounds are the conservative intersection of robot.urdf.xacro and
    joint_limits.yaml. Rotary velocity is 15 deg/s and rotary acceleration and
    stopping acceleration are 0.75 rad/s^2 by ELECTRI-102 decision. Updown uses
    0.09 m/s and 0.5 m/s^2. Margins are 0.5 deg rotary and 5 mm Updown.
  owner: Sevenova RT-Control
  commissioning_schedule: domains/rt_control/BLOCKED-questions.md#bq-138--electri-102-production-envelope-bench-measurement
  warning: >
    THIS FILE DOES NOT REPLACE BENCH MEASUREMENT. Values are estimated and
    permit only separately authorized low-speed Rolling validation; see the
    commissioning_schedule entry before promoting limits_source to production.

