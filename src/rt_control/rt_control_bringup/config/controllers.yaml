controller_manager:
  ros__parameters:
    update_rate: 250
    thread_priority: 80

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rt_internal_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    whole_body_jtc:
      type: joint_trajectory_controller/JointTrajectoryController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    enable_manager:
      type: enable_manager/EnableManagerController

joint_state_broadcaster:
  ros__parameters:
    update_rate: 100
    publish_dynamic_joint_states: false
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - turn
      - updown
    interfaces:
      - position

rt_internal_state_broadcaster:
  ros__parameters:
    update_rate: 50
    use_local_topics: true
    publish_dynamic_joint_states: true

whole_body_jtc:
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - turn
      - updown
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    open_loop_control: false
    set_last_command_interface_value_as_state_on_activation: false
    trajectory_start_consistency_check:
      enabled: true
      position_tolerances:
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.017453292519943295
        - 0.05
      feedback_age_state_interface: ethercat_domain/process_data_age_ms
      max_feedback_age_ms: 500.0
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.01

# Fixed axis order for all 14-value arrays:
# right_joint1..6, left_joint1..6, turn, updown.
rolling_trajectory_controller:
  ros__parameters:
    configuration_source: provisional
    allow_test_only_configuration: false
    allow_provisional_configuration: true
    # rt_control.launch.py overrides this with the installed absolute path.
    envelope_file: ""
    buffer_capacity: 64
    max_horizon_ms: 600
    required_initial_horizon_ms: 500
    update_timeout_ms: 200
    replace_lead_ms: 16
    state_publish_period_ms: 20
    prime_timeout_ms: 100
    nominal_controller_period_ms: 4
    maximum_controller_period_ms: 8
    one_cycle_detection_guard_ms: 4
    stop_time_growth_guard_ms: 4
    non_rt_to_rt_visibility_guard_ms: 4
    period_quantization_guard_ms: 4
    open_feedback_age_limit_ms: 500.0
    takeover_tolerances:
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.00872664626
      - 0.005
    splice_position_tolerances:
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.01
      - 0.003
    splice_velocity_tolerances:
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.02

enable_manager:
  ros__parameters:
    batch_timeout: 4.0
    disable_stage_timeout: 4.0
    inter_batch_delay: 0.2
    fault_reset_timeout: 4.0
    controller_switch_timeout: 4.0
    service_result_timeout_ms: 30000
    motion_controller_names:
      - whole_body_jtc
      - rolling_trajectory_controller
    default_motion_controller: whole_body_jtc

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - left_track_joint
    right_wheel_names:
      - right_track_joint
    wheel_separation: 0.82
    wheels_per_side: 1
    wheel_radius: 1.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    position_feedback: true
    open_loop: false
    enable_odom_tf: false
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    publish_rate: 50.0
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.min_velocity: -0.3
    linear.x.max_velocity: 0.3
    linear.x.min_acceleration: -0.6
    linear.x.max_acceleration: 0.6
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.min_velocity: -0.3
    angular.z.max_velocity: 0.3
    angular.z.min_acceleration: -0.6
    angular.z.max_acceleration: 0.6
