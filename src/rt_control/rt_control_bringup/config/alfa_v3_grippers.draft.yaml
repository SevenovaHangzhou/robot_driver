# Position-only PP controller draft. Not loaded by production launch while any
# hardware identity, zero, travel or stop/hold parameter remains unresolved.
controller_manager:
  ros__parameters:
    left_gripper_controller:
      type: forward_command_controller/ForwardCommandController
    right_gripper_controller:
      type: forward_command_controller/ForwardCommandController

left_gripper_controller:
  ros__parameters:
    joints: [left_moving_jaw_joint]
    interface_name: position

right_gripper_controller:
  ros__parameters:
    joints: [right_moving_jaw_joint]
    interface_name: position

position_action_adapter:
  ros__parameters:
    left_pp:
      configured: false
      command_topic: /left_gripper_controller/commands
      minimum_position: TBD
      maximum_position: TBD
      tolerance: TBD
      feedback_timeout_s: TBD
      command_timeout_s: TBD
    right_pp:
      configured: false
      command_topic: /right_gripper_controller/commands
      minimum_position: TBD
      maximum_position: TBD
      tolerance: TBD
      feedback_timeout_s: TBD
      command_timeout_s: TBD
