controller_manager:
  ros__parameters:
    swerve_controller:
      type: swerve_driver/SwerveController
# Exercised values: ELECTRI-127 Advantech bench (controllers.runtime.yaml on 946ec110),
# except user 2026-10-17: max_linear_speed/max_wheel_speed 2 m/s, max_wheel_acceleration 2 m/s^2
# (both wheel-surface units), max_steering_slew 35 deg/s, max_steering_acceleration 35 deg/s^2.
# PLACEHOLDER (user 2026-10-17): covariance/IMU values are uncalibrated; replace after the
# joint backlash + IMU variance calibration. Do not treat published odometry covariance as measured.
swerve_controller:
  ros__parameters:
    steering_min:
    - -2.356194490192345
    - -2.356194490192345
    - -2.356194490192345
    - -2.356194490192345
    steering_max:
    - 2.356194490192345
    - 2.356194490192345
    - 2.356194490192345
    - 2.356194490192345
    steering_limit_margin:
    - 0.2617993877991494
    - 0.2617993877991494
    - 0.2617993877991494
    - 0.2617993877991494
    steering_limit_tolerance:
    - 0.0017453292519943296
    - 0.0017453292519943296
    - 0.0017453292519943296
    - 0.0017453292519943296
    max_linear_speed: 2.0
    max_angular_speed: 0.8
    max_wheel_speed: 2.0
    max_wheel_acceleration: 2.0
    # Chassis twist S-curve enabled for the Advantech deployment (2026-10-23).
    # Initial tuning values; actual stopping distance still needs operator acceptance.
    # Both limits must be finite positive to enable, or both .inf to preserve old behaviour.
    # Norm limits on (vx, vy, omega*R); R is the farthest module radius. Units m/s^2, m/s^3.
    max_body_acceleration: 1.0
    max_body_jerk: 4.0
    velocity_deadband: 0.001
    max_encoder_difference: 0.017453292519943295
    max_update_period: 0.2
    slip_residual_threshold: 1.0
    # User 2026-10-21: align_first stops all four wheels while any module is more
    # than 5 deg off and restarts them once every module is within 3 deg.
    # steer_while_driving restores the 2026-10-18 behaviour: cos(steering error) scaling with
    # the alignment_threshold gate (operator-tunable (0, 90] deg; ignored in align_first).
    drive_mode: steer_while_driving
    align_first_threshold: 0.08726646259971647
    align_first_release: 0.05235987755982988
    alignment_threshold: 1.5707963267948966
    flip_hysteresis: 0.05235987755982989
    max_steering_slew: 0.6108652381980153
    max_steering_acceleration: 0.6108652381980153
    # S-curve steering, user 2026-10-18: 100 deg/s^3 (operator-tunable, cap 1000 deg/s^3).
    max_steering_jerk: 1.7453292519943295
    translation_heading_epsilon: 1e-06
    steering_angle_deadband: 0.0017453292519943296
    feedback_timeout: 0.2
    # Motion fault: latched; ordered disable once all wheels <= 0.01 m/s for 50 ms (or 2 s).
    fault_stop_speed: 0.01
    fault_stop_hold: 0.05
    fault_stop_timeout: 2.0
    pose_covariance:
    - 0.01
    - 0.01
    - 1000000.0
    - 1000000.0
    - 1000000.0
    - 0.05
    twist_covariance:
    - 0.01
    - 0.01
    - 1000000.0
    - 1000000.0
    - 1000000.0
    - 0.05
    imu_fallback_covariance_scale: 2.0
    missing_module_covariance_scale: 2.0
    slip_covariance_scale: 4.0
    imu_enabled: false
    imu_frame_id: imu_link
    imu_timeout: 0.1
    max_imu_yaw_step: 0.1
    quaternion_norm_tolerance: 0.01
