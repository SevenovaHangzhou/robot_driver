bms_node:
  ros__parameters:
    # Golden Phoenix V1.1 through the dedicated gs_usb SocketCAN adapter on can1.
    # The host must bring can1 up at 250 kbit/s; this node does not configure it.
    transport: socketcan
    can_interface: can1
    # Reject a can1 device that is not the approved BMS USB-CAN adapter.
    expected_adapter_serial: "004D00675230500720333159"
    protocol: golden_phoenix_v1_1
    can_bitrate: 250000
    # BMS addresses 0x01/0x02 and host address 0x40, written in decimal here.
    primary_bms_address: 1
    secondary_bms_address: 2
    host_address: 64
    # "auto" rejects ambiguous byte order; set an explicit order after verification.
    multi_byte_order: auto

    # Seconds. Each data ID for each battery is queried once per request_period_s.
    request_period_s: 0.2
    # Maximum receive wait and delay before retrying a disconnected CAN interface.
    receive_timeout_s: 0.5
    reconnect_period_s: 2.0
    # 状态发布周期和数据最大有效时间。
    publish_period_s: 5.0
    frame_timeout_s: 3.0

    # 0x93 未规定 MOS 状态原始值。-1 表示只显示“未知（原始值N）”；取得厂家或
    # 抓包确认后，把下面两项同时改成互不相同的 0..255 数值。
    mos_closed_raw: -1
    mos_open_raw: -1

    # 两块电池分别发布标准数值状态和中文状态/故障，数据不合并。
    primary_battery_state_topic: /battery_state
    secondary_battery_state_topic: /battery_state/secondary
    primary_status_chinese_topic: /bms/primary/status_chinese
    secondary_status_chinese_topic: /bms/secondary/status_chinese
    primary_fault_chinese_topic: /bms/primary/fault_chinese
    secondary_fault_chinese_topic: /bms/secondary/fault_chinese
