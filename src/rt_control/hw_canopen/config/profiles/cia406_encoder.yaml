plugin: hw_canopen/SwerveEncoderSystem
node_driver:
  class: ros2_canopen::ProxyDriver
  package: canopen_proxy_driver
master_driver:
  class: ros2_canopen::MasterDriver
  package: canopen_master_driver
position_pdo:
  index: 24580
  subindex: 0
  bit_length: 32
  signed: false
state_interfaces:
- position
- feedback_age_ms
- ready
# Ready also requires a frame newer than this (5 SYNC periods at 4 ms).
ready_feedback_age_ms: 20.0
# Bus policy exercised on the Advantech chassis bench (ELECTRI-127, 2026-10-14..16).
master_settings:
  start: true
  start_nodes: true
  start_all_nodes: false
  reset_all_nodes: false
  stop_all_nodes: false
node_settings:
  heartbeat_consumer: false
  heartbeat_producer: 0
  mandatory: true
  polling: true
  period: 4
  enable_diagnostics: false
  boot_timeout_ms: 5000
  sdo_timeout_ms: 500
  non_transmit_timeout: 2000
  diagnostics:
    enable: false
  tpdo:
    1:
      transmission: 1
      event_timer: 0
    2:
      enabled: false
# TPDO2 is disabled by setting the invalid bit on its default COB-ID (0x280 + node).
tpdo2_disabled_cob_id_base: 2147484288
