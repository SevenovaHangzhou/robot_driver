options:
  dcf_path: "@BUS_CONFIG_PATH@"

master:
  node_id: 100
  driver: "ros2_canopen::MasterDriver"
  package: "canopen_master_driver"
  heartbeat_consumer: true
  heartbeat_producer: 1000
  heartbeat_multiplier: 5.0
  stop_all_nodes: true

defaults:
  dcf: "eds/ld2_drive.eds"
  driver: "ros2_canopen::Cia402Driver"
  package: "canopen_402_driver"
  period: 20
  heartbeat_consumer: true
  heartbeat_producer: 1000
  heartbeat_multiplier: 5.0
  sdo_timeout_ms: 500
  # Allow one full 1000 ms heartbeat period plus reset/configuration latency.
  boot_timeout_ms: 2000
  diagnostics:
    enable: true
    period: 1000
  # Heartbeat keys intentionally make dcfgen configure 0x1016/0x1017 at startup.
  # Do not add ad-hoc sdo/rpdo/tpdo entries: deployed PDO mappings remain the
  # drive-configuration authority and are archived read-only during commissioning.

nodes:
  left_track_joint:
    node_id: 2
    mandatory: true
    operation_mode: 3
    scale_pos_to_dev: -304894.5269959681
    scale_pos_from_dev: -3.27982273034774e-6
    scale_vel_to_dev: -304894.5269959681
    scale_vel_from_dev: -3.27982273034774e-6
    offset_pos_to_dev: 0.0
    offset_pos_from_dev: 0.0
  right_track_joint:
    node_id: 3
    mandatory: true
    operation_mode: 3
    scale_pos_to_dev: -304894.5269959681
    scale_pos_from_dev: -3.27982273034774e-6
    scale_vel_to_dev: -304894.5269959681
    scale_vel_from_dev: -3.27982273034774e-6
    offset_pos_to_dev: 0.0
    offset_pos_from_dev: 0.0
