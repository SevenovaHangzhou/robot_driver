options:
  dcf_path: "@BUS_CONFIG_PATH@"

master:
  node_id: 100
  driver: "ros2_canopen::MasterDriver"
  package: "canopen_master_driver"

defaults:
  dcf: "eds/ld2_drive.eds"
  driver: "ros2_canopen::Cia402Driver"
  package: "canopen_402_driver"
  period: 20
  heartbeat_consumer: true
  sdo_timeout_ms: 500
  # REQ-CAN-007/008: do not add sdo/rpdo/tpdo entries here. The deployed
  # mappings and 0x1017 producer time are read-only commissioning inputs.

nodes:
  updown:
    node_id: 1
    operation_mode: 1
    scale_pos_to_dev: 1000000.0
    scale_pos_from_dev: 0.000001
  left_track:
    node_id: 2
    operation_mode: 3
    scale_vel_to_dev: -731746.8647903234
    scale_vel_from_dev: -1.36659280431156e-6
  right_track:
    node_id: 3
    operation_mode: 3
    scale_vel_to_dev: -731746.8647903234
    scale_vel_from_dev: -1.36659280431156e-6
