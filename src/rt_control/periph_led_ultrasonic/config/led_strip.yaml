led_strip_node:
  ros__parameters:
    # The DIO module of periph_plc_io owns 192.168.1.12; the gateway moved to .14 on 2026-11-18.
    gateway_ip: "192.168.1.14"
    gateway_ports: [502, 502, 502, 502, 502, 502]
    # 六个控制器共享 HC0/502，使用现场配置的独立 RTU 站号。
    controller_addresses: [1, 2, 3, 4, 5, 6]
    # Must exceed the gateway RTU receive timeout (HC0: 1000 ms); see ultrasonic.yaml.
    response_timeout_ms: 1200
    # Idle time before each request on a gateway port; see ultrasonic.yaml.
    request_gap_ms: 20
    # Bound six sequential exit writes even when some RTU stations are offline.
    exit_response_timeout_ms: 1200
    # Graceful SIGINT/SIGTERM writes RGBW=0; a caught fatal error writes red.
    exit_color_enabled: true
