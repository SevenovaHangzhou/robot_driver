led_strip_node:
  ros__parameters:
    gateway_ip: "192.168.1.12"
    gateway_ports: [502, 502, 502, 502, 502, 502]
    # 六个控制器共享 HC0/502，使用现场配置的独立 RTU 站号。
    controller_addresses: [1, 2, 3, 4, 5, 6]
    response_timeout_ms: 500
    # Bound six sequential exit writes even when some RTU stations are offline.
    exit_response_timeout_ms: 800
    # Graceful SIGINT/SIGTERM writes RGBW=0; a caught fatal error writes red.
    exit_color_enabled: true
