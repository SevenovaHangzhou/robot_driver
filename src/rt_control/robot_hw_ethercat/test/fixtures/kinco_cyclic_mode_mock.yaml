product_id: 2
assign_activate: 0
use_slave_pdo_defaults: true
kinco_cyclic_mode:
  verified: true
  mock_only: true
  position_counts_per_unit: 1000.0
  velocity_counts_per_unit: 100.0
  position_offset_counts: 100.0
  min_position: -2.0
