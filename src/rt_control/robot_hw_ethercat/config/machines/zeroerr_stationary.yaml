# Stationary enable only: no position command interface, no PP new-setpoint trigger.
# Editable map 1600 carries target+controlword only (6 bytes); feedback stays 10 bytes.
# 60FE bit0 releases the brake, so this entry does not write digital outputs.
# Mode is filled from the per-axis inventory.
vendor_id: 0x5A65726F
product_id: 0x00029252
assign_activate: 0x0300
auto_fault_reset: false
auto_state_transitions: false
use_slave_pdo_defaults: false
sdo:
  - {index: 0x6060, sub_index: 0, type: int8, value: TBD}
rpdo:
  - index: 0x1600
    channels:
      - {index: 0x607A, sub_index: 0, type: int32, default: .nan}
      - {index: 0x6040, sub_index: 0, type: uint16, command_interface: control_word, default: 0}
tpdo:
  - index: 0x1A00
    channels:
      - {index: 0x6064, sub_index: 0, type: int32, state_interface: position_raw}
      - {index: 0x60FD, sub_index: 0, type: uint32, state_interface: digital_inputs}
      - {index: 0x6041, sub_index: 0, type: uint16, state_interface: status_word}
