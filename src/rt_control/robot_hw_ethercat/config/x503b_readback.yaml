schema_version: 1
profile: x503b_v1
# X503-B V1.6: code 5=N, code 7=N.m.  Runtime still validates the
# configured tuple with a read-only SDO snapshot before publishing WrenchStamped.
engineering_unit_contract: force_N_torque_Nm
validity_policy: sample_codes_in_range
valid_sample_codes: []
# Unit-code meanings come from the X503-B V1.6 manual.  The validity policy is
# an explicit user-approved range assumption, not a claim that it detects stale frames.
sample_code_min: -999999
sample_code_max: 999999
read_only_sdo:
  index: 0x8005
  decimal_subindices: [6, 7, 8, 9, 10, 11]
  unit_subindices: [12, 13, 14, 15, 16, 17]
  expected_unit_codes: [5, 5, 5, 7, 7, 7]
