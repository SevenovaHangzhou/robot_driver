# T-model only: eRob manual V3.44 chapter 22, 0x3B69:00 INT32 mNm.
# Keep sensor_torque_mnm in the device sign; sign/zero calibration is not yet verified.
# Do not export this uncalibrated measurement as joint effort. TxPDO size: 22 bytes.
# ZeroErr eRob CSP with diagnostic feedback for the Runtime-LOG black box (ELECTRI-127, user
# 2026-10-18): TxPDO 0x1A00 additionally maps 0x606C velocity actual value, 0x6077 torque actual
# value and 0x603F error code (manual 8.2.59 / 4.4.2: 0x1A00 accepts arbitrary mapping, <= 76 B;
# this mapping is 18 B). Used by the bench module first; other modules switch after their own
# hardware check. `scale` is consumed by the renderer and never reaches the driver:
#   velocity  -> output-side rad/s (position factor, no offset, with the axis direction)
#   direction -> raw value times the axis direction (0x6077 in per mille of rated current; communication manual v1.10 8.2.97)
# RxPDO mirrors (patch ecat_icube 0014): target_position / control_word_sent report the values the
# outgoing frame actually carries (including the plugin's preload/hold), in interface units.
identity:
  vendor_id: 1516597871
  product_code: 168530
  revision_number: 1
# Codes a drive latches without entering Fault when the master leaves OP. 0xA000 (manual 7.2.27,
# EtherCAT communication abnormal) is left by every orderly stop, so startup accepts it (user
# decision 2026-10-17). If the status word shows Fault, enable_manager clears it with one
# CiA402 fault reset; no other code is accepted here.
startup_reset:
  codes:
  - 40960
  method: cia402_fault_reset
  owner: enable_manager
encoder_policies:
  single_turn:
    requires_multiturn_retention: false
    startup_battery_reset_codes:
    - 29455
    startup_reset_method: cia402_fault_reset
    reset_owner: enable_manager
    require_fault_free_status: true
    auto_reset_load_encoder: false
    require_nonwrapping_output_range: true
    output_count_interval: TBD
    range_verified: false
  multiturn_required:
    requires_multiturn_retention: true
    startup_battery_reset_codes: []
    require_fault_free_status: true
    auto_reset_load_encoder: false
    require_valid_battery: true
    require_valid_multiturn_reference: true
    battery_verified: false
    reference_verified: false
driver_config:
  vendor_id: 1516597871
  product_id: 168530
  assign_activate: 768
  auto_fault_reset: false
  auto_state_transitions: false
  use_slave_pdo_defaults: false
  sdo:
  - index: 24672
    sub_index: 0
    type: int8
    value: 8
  # 0x605E fault reaction (user 2026-10-17): quick-stop ramp, then disable; the eRob closes
  # its brake on disable. Applies to communication loss (0xA000) while enabled.
  - index: 24670
    sub_index: 0
    type: int16
    value: 2
  # 0x6085 quick-stop deceleration 40 deg/s^2 (user 2026-10-17) = 58254 output counts/s^2.
  - index: 24709
    sub_index: 0
    type: uint32
    value: 58254
  rpdo:
  - index: 5632
    channels:
    - index: 24698
      sub_index: 0
      type: int32
      default: .nan
      command_interface: position
      mirror_state_interface: target_position
    - index: 24640
      sub_index: 0
      type: uint16
      command_interface: control_word
      default: 0
      mirror_state_interface: control_word_sent
  tpdo:
  - index: 6656
    channels:
    - index: 24676
      sub_index: 0
      type: int32
      state_interface: position
    - index: 24829
      sub_index: 0
      type: uint32
      state_interface: digital_inputs
    - index: 24641
      sub_index: 0
      type: uint16
      state_interface: status_word
    - index: 24684
      sub_index: 0
      type: int32
      state_interface: velocity
      scale: velocity
    - index: 24695
      sub_index: 0
      type: int16
      state_interface: torque_permille
      scale: direction
    - index: 24639
      sub_index: 0
      type: uint16
      state_interface: error_code
    - index: 15209
      sub_index: 0
      type: int32
      state_interface: sensor_torque_mnm
