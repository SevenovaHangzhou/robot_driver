# Synthetic calibration and timings for in-memory tests only; the layout is the fixed XMC_ESC one.
vendor_id: 1
product_id: 2
assign_activate: 0
use_slave_pdo_defaults: true
pp:
  verified: true
  # Joint +Z is up while the motor's positive direction is down.
  counts_per_metre: -1000000.0
  zero_counts: 500000.0
  min_position: 0.0
  max_position: 0.18
  position_tolerance: 0.0005
  stopped_velocity: 0.0005
  ack_timeout: 0.1
  halt_timeout: 0.2
  stopped_cycles: 2
  max_velocity: 0.03
  profile_velocity_per_metre_per_second: 120000.0
  max_profile_velocity: 3600
sdo:
  - {index: 0x6083, sub_index: 0, type: uint32, value: 1400}
  - {index: 0x6084, sub_index: 0, type: uint32, value: 1400}
rpdo:
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16}
      - {index: 0x6071, sub_index: 0, type: int16}
      - {index: 0x60ff, sub_index: 0, type: int32}
      - {index: 0x607a, sub_index: 0, type: int32}
      - {index: 0x6081, sub_index: 0, type: uint32}
      - {index: 0x6060, sub_index: 0, type: int8}
      - {index: 0x607f, sub_index: 0, type: uint32}
tpdo:
  - index: 0x1a00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16}
      - {index: 0x603f, sub_index: 0, type: uint16}
      - {index: 0x6078, sub_index: 0, type: int16}
      - {index: 0x606c, sub_index: 0, type: int32}
      - {index: 0x6064, sub_index: 0, type: int32}
      - {index: 0x6061, sub_index: 0, type: int8}
      - {index: 0x6000, sub_index: 0, type: uint8}
      - {index: 0x2300, sub_index: 0, type: uint16}
      - {index: 0x2301, sub_index: 0, type: uint16}
      - {index: 0x60fd, sub_index: 0, type: uint32}
      - {index: 0x6077, sub_index: 0, type: int16}
