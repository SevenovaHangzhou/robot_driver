controller_manager:
  ros__parameters:
    swerve_controller:
      type: ctrl_swerve/SwerveController
# Exercised values: ELECTRI-127 Advantech bench (controllers.runtime.yaml on 946ec110),
# User 2026-11-24 (#333): chassis translation 1 m/s, wheels 2 m/s and 2 m/s^2;
# steering 90 deg/s and 180 deg/s^2, with separate translation/rotation acceleration.
# PLACEHOLDER (user 2026-10-17): covariance/IMU values are uncalibrated; replace after the
# joint backlash + IMU variance calibration. Do not treat published odometry covariance as measured.
swerve_controller:
  ros__parameters:
    steering_min:
    - -2.356194490192345
    - -2.356194490192345
    - -2.356194490192345
    - -2.356194490192345
    steering_max:
    - 2.356194490192345
    - 2.356194490192345
    - 2.356194490192345
    - 2.356194490192345
    steering_limit_margin:
    - 0.2617993877991494
    - 0.2617993877991494
    - 0.2617993877991494
    - 0.2617993877991494
    steering_limit_tolerance:
    - 0.0017453292519943296
    - 0.0017453292519943296
    - 0.0017453292519943296
    - 0.0017453292519943296
    max_linear_speed: 1.0
    max_angular_speed: 0.8
    max_wheel_speed: 2.0
    max_wheel_acceleration: 2.0
    # User 2026-11-24 (#333): XY acceleration norm and independent yaw acceleration.
    max_linear_acceleration: 1.0
    max_angular_acceleration: 0.39269908169872414
    max_rotation_speed: 1.5
    max_rotation_acceleration: 1.5
    rotation_stop_speed: 0.01
    rotation_stop_hold: 0.05
    # Jerk norm uses (vx, vy, omega*R), R = farthest module radius.
    max_body_jerk: 4.0
    velocity_deadband: 0.001
    max_encoder_difference: 0.017453292519943295
    max_update_period: 0.2
    slip_residual_threshold: 1.0
    # User 2026-11-24 (#333): continuous steering; cosine compensation and 90 deg error gate.
    # The 5/3 deg hysteresis applies only when align_first is selected at startup.
    drive_mode: steer_while_driving
    align_first_threshold: 0.08726646259971647
    align_first_release: 0.05235987755982988
    alignment_threshold: 1.5707963267948966
    flip_hysteresis: 0.05235987755982989
    max_steering_slew: 1.5707963267948966
    max_steering_acceleration: 3.141592653589793
    max_steering_slew_limit: 1.5707963267948966
    max_steering_acceleration_limit: 3.141592653589793
    # S-curve steering, user 2026-10-18: 100 deg/s^3 (operator-tunable, cap 1000 deg/s^3).
    max_steering_jerk: 1.7453292519943295
    translation_heading_epsilon: 1e-06
    steering_angle_deadband: 0.0017453292519943296
    feedback_timeout: 0.2
    # Motion fault: latched; ordered disable once all wheels <= 0.01 m/s for 50 ms (or 2 s).
    fault_stop_speed: 0.01
    fault_stop_hold: 0.05
    fault_stop_timeout: 2.0
    pose_covariance:
    - 0.01
    - 0.01
    - 1000000.0
    - 1000000.0
    - 1000000.0
    - 0.05
    twist_covariance:
    - 0.01
    - 0.01
    - 1000000.0
    - 1000000.0
    - 1000000.0
    - 0.05
    imu_fallback_covariance_scale: 2.0
    missing_module_covariance_scale: 2.0
    slip_covariance_scale: 4.0
    imu_enabled: false
    imu_frame_id: imu_link
    imu_timeout: 0.1
    max_imu_yaw_step: 0.1
    quaternion_norm_tolerance: 0.01
