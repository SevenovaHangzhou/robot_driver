name: rt-control-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen legacy baseline
        uses: actions/checkout@v4
        with:
          repository: SevenovaHangzhou/robot_driver
          ref: 6bc94cd564361b9e4aa785af74683ecf13e258ce
          path: .legacy/robot_driver
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep python3-yaml
      - name: Install package dependencies
        shell: bash
        run: |
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install
      - name: Enforce frozen EtherCAT migration gate
        run: |
          python3 tools/diff_legacy.py \
            --legacy-root .legacy/robot_driver \
            --target-root .
