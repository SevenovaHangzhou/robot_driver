name: rt-control-ci

# Plan A (user 2026-10-30): pull requests are gated only by governance (fast); the full V3
# build runs nightly on main, on manual dispatch, or on a pull request labelled full-ci.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 18 * * *"  # 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rt-control-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RT_CONTROL_CI_BASE_IMAGE: ${{ vars.RT_CONTROL_CI_IMAGE || '' }}

  # A repository variable can point at the published ROS+EtherLab base image.
  # Until it is set, jobs retain the current public ROS image fallback.

jobs:
  governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    container: ${{ vars.RT_CONTROL_CI_IMAGE || 'ros:humble-ros-base' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Cache governance apt archives
        uses: actions/cache@v5
        with:
          path: .ci/apt
          key: rt-control-governance-apt-${{ runner.os }}-${{ hashFiles('pre-commit-config.yaml') }}
          restore-keys: |
            rt-control-governance-apt-${{ runner.os }}-
      - name: Trust the checked-out workspace inside the job container
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install quality-gate tools
        if: env.RT_CONTROL_CI_BASE_IMAGE == ''
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.ci/apt/partial"
          apt_options=(
            -o "Dir::Cache::archives=${GITHUB_WORKSPACE}/.ci/apt"
          )
          apt-get update
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            python3-coverage \
            python3-pip \
            python3-pytest \
            python3-yaml \
            python3-jsonschema \
            ripgrep \
            shellcheck
          python3 -m pip install --no-cache-dir pre-commit==3.7.1
      - name: Install and verify Draft 7 validator
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-jsonschema
          python3 -c "import jsonschema; assert jsonschema.__version__.startswith('3.2.')"
      - name: Install pinned incremental style tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-format-14 python3-pip
          python3 -m pip install --no-cache-dir -r tools/style-requirements.txt
      - name: Run the same gate used by pre-commit
        shell: bash
        env:
          REQUIRE_SHELLCHECK: "1"
          REQUIRE_STYLE_TOOLS: "1"
          STYLE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Enforce pull request contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: python3 tools/pr_contract_gate.py --event-path "${GITHUB_EVENT_PATH}"

  build:
    needs: governance
    if: >-
      always() && needs.governance.result != 'failure' && needs.governance.result != 'cancelled' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-22.04
    container: ${{ vars.RT_CONTROL_CI_IMAGE || 'ros:humble-ros-base' }}
    timeout-minutes: 30
    env:
      RT_CONTROL_NATIVE_WS: /tmp/rt-control-ci-ws
      RT_CONTROL_VENDOR_CACHE: ${{ github.workspace }}/.ci/vendor
      CCACHE_DIR: ${{ github.workspace }}/.ci/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache pinned vendor checkout
        uses: actions/cache@v5
        with:
          path: .ci/vendor
          key: rt-control-vendor-v1-${{ runner.os }}-${{ hashFiles('deps.repos') }}
          restore-keys: |
            rt-control-vendor-v1-${{ runner.os }}-
            rt-control-ci-${{ runner.os }}-${{ hashFiles('deps.repos', 'versions.env') }}
            rt-control-ci-${{ runner.os }}-
      - name: Cache apt archives
        uses: actions/cache@v5
        with:
          path: .ci/apt
          key: rt-control-apt-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            rt-control-apt-v1-${{ runner.os }}-
      - name: Cache compiler artifacts
        uses: actions/cache@v5
        with:
          path: .ci/ccache
          key: rt-control-ccache-v1-${{ runner.os }}-${{ hashFiles('deps.repos', 'versions.env') }}-${{ github.sha }}
          restore-keys: |
            rt-control-ccache-v1-${{ runner.os }}-${{ hashFiles('deps.repos', 'versions.env') }}-
            rt-control-ccache-v1-${{ runner.os }}-
      - name: Install build tools
        if: env.RT_CONTROL_CI_BASE_IMAGE == ''
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.ci/apt/partial"
          apt_options=(
            -o "Dir::Cache::archives=${GITHUB_WORKSPACE}/.ci/apt"
          )
          apt-get update
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            git \
            liburdfdom-tools \
            libtool \
            pkg-config \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            python3-yaml \
            python3-jsonschema \
            ccache
          mkdir -p "${GITHUB_WORKSPACE}/.ci/apt" "${CCACHE_DIR}"
      - name: Install and verify Draft 7 validator
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-jsonschema
          python3 -c "import jsonschema; assert jsonschema.__version__.startswith('3.2.')"
      - name: Import frozen source dependencies
        shell: bash
        run: |
          mkdir -p "${RT_CONTROL_NATIVE_WS}"
          if [[ -d "${RT_CONTROL_VENDOR_CACHE}/robot_interfaces/.git" ]]; then
            mkdir -p "${RT_CONTROL_NATIVE_WS}/src/vendor"
            cp -a "${RT_CONTROL_VENDOR_CACHE}/." "${RT_CONTROL_NATIVE_WS}/src/vendor/"
          else
            vcs import --shallow --retry 5 --workers 1 \
              "${RT_CONTROL_NATIVE_WS}" < deps.repos
            mkdir -p "${RT_CONTROL_VENDOR_CACHE}"
            cp -a "${RT_CONTROL_NATIVE_WS}/src/vendor/." "${RT_CONTROL_VENDOR_CACHE}/"
          fi
          tools/bootstrap_native_dev.sh prepare
      - name: Install pinned IgH userspace dependency
        if: env.RT_CONTROL_CI_BASE_IMAGE == ''
        shell: bash
        run: |
          source versions.env
          [[ "${IGH_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          git init /tmp/ethercat
          git -C /tmp/ethercat remote add origin \
            https://gitlab.com/etherlab.org/ethercat.git
          git -C /tmp/ethercat fetch --depth 1 origin "${IGH_COMMIT}"
          git -C /tmp/ethercat checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ethercat rev-parse HEAD)" = "${IGH_COMMIT}"
          (
            cd /tmp/ethercat
            ./bootstrap
            ./configure --prefix=/usr/local/etherlab --disable-kernel
            make -j"$(nproc)"
            make install
          )
          ldconfig
      - name: Install package dependencies
        shell: bash
        run: |
          rosdep init 2>/dev/null || true
          rosdep update
          rt_control_packages=(
            robot_rt_control_interfaces
            robot_system_interfaces
            robot_interfaces_qos
            periph_bms
            periph_imu_lpms
            periph_led_ultrasonic
            canopen_master_driver
            canopen_ros2_control
            integ_api_adapter
            ethercat_driver
            ethercat_generic_cia402_drive
            joint_trajectory_controller
            gripper_controllers
            periph_plc_io
            robot_description
            rt_control_interfaces
            hw_ethercat
            hw_canopen
            hw_can_damiao
            ctrl_enable_manager
            hw_semantic_components
            ctrl_rolling_trajectory
            ctrl_force_torque_broadcaster
            ctrl_swerve
            integ_composer
            hwcfg_machines
            integ_bringup
            rt_control_operator_web
          )
          mapfile -t dependency_paths < <(
            colcon list \
              --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
              --paths-only \
              --packages-up-to "${rt_control_packages[@]}"
          )
          rosdep install --from-paths "${dependency_paths[@]}" \
            --ignore-src \
            --rosdistro humble \
            --skip-keys ethercat_driver \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types buildtool_export \
            --dependency-types exec \
            --dependency-types test \
            -r -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          ccache --zero-stats
          colcon build --symlink-install \
            --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
            --packages-up-to \
            robot_rt_control_interfaces \
            robot_system_interfaces \
            robot_interfaces_qos \
            periph_bms \
            periph_imu_lpms \
            periph_led_ultrasonic \
            canopen_master_driver \
            canopen_ros2_control \
            integ_api_adapter \
            ethercat_driver \
            ethercat_generic_cia402_drive \
            joint_trajectory_controller \
            gripper_controllers \
            periph_plc_io \
            robot_description \
            rt_control_interfaces \
            hw_ethercat \
            hw_canopen \
            hw_can_damiao \
            ctrl_enable_manager \
            hw_semantic_components \
            ctrl_rolling_trajectory \
            ctrl_force_torque_broadcaster \
            ctrl_swerve \
            integ_composer \
            hwcfg_machines \
            integ_bringup \
            rt_control_operator_web \
            --cmake-args -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Report compiler cache
        if: always()
        shell: bash
        run: ccache --show-stats
      - name: Install upstream controller test hardware
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          # Humble test assets reference test_actuator/test_system, supplied by
          # this test-only package rather than the installed hardware_interface.
          fixture_root="${RUNNER_TEMP}/ros2-control-test-fixtures"
          fixture_commit=e65ddd72804f3f2d9b19e533a15ed436b2f3fc42
          git init "${fixture_root}/src"
          git -C "${fixture_root}/src" remote add origin \
            https://github.com/ros-controls/ros2_control.git
          git -C "${fixture_root}/src" fetch --depth 1 origin "${fixture_commit}"
          git -C "${fixture_root}/src" checkout --detach FETCH_HEAD
          test "$(git -C "${fixture_root}/src" rev-parse HEAD)" = "${fixture_commit}"
          colcon --log-base "${fixture_root}/log" build \
            --base-paths "${fixture_root}/src/hardware_interface_testing" \
            --build-base "${fixture_root}/build" \
            --install-base "${fixture_root}/install" \
            --cmake-args -DBUILD_TESTING=OFF
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source "${RUNNER_TEMP}/ros2-control-test-fixtures/install/setup.bash"
          colcon test --event-handlers console_direct+ \
            --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
            --packages-up-to \
            robot_rt_control_interfaces \
            robot_system_interfaces \
            robot_interfaces_qos \
            periph_bms \
            periph_imu_lpms \
            periph_led_ultrasonic \
            canopen_master_driver \
            canopen_ros2_control \
            integ_api_adapter \
            ethercat_driver \
            ethercat_generic_cia402_drive \
            joint_trajectory_controller \
            gripper_controllers \
            periph_plc_io \
            robot_description \
            rt_control_interfaces \
            hw_ethercat \
            hw_canopen \
            hw_can_damiao \
            ctrl_enable_manager \
            hw_semantic_components \
            ctrl_rolling_trajectory \
            ctrl_force_torque_broadcaster \
            ctrl_swerve \
            integ_composer \
            hwcfg_machines \
            integ_bringup \
            rt_control_operator_web \
            --packages-skip joint_trajectory_controller
          # Upstream JTC tests use wall-clock sleeps and tight publication windows.
          # Run the unchanged suite alone after other packages to avoid cross-package load.
          colcon test --event-handlers console_direct+ --executor sequential \
            --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
            --packages-select joint_trajectory_controller
          colcon test-result --verbose
      - name: Validate shared robot description
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro src/description/robot_description/urdf/robot_alfav3_mobile.urdf \
            > /tmp/robot-description-ci.urdf
          check_urdf /tmp/robot-description-ci.urdf
      - name: Enforce V3 source and runtime boundary
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 tools/check_v3_branch_contract.py
