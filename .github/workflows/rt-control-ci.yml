name: rt-control-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rt-control-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace inside the job container
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install quality-gate tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-coverage \
            python3-pip \
            python3-pytest \
            python3-yaml \
            ripgrep \
            shellcheck
          python3 -m pip install --no-cache-dir pre-commit==3.7.1
      - name: Run the same gate used by pre-commit
        shell: bash
        env:
          REQUIRE_SHELLCHECK: "1"
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Enforce pull request contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: python3 tools/pr_contract_gate.py --event-path "${GITHUB_EVENT_PATH}"

  build:
    needs: governance
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 30
    env:
      RT_CONTROL_NATIVE_WS: /tmp/rt-control-ci-ws
      X503_ETHERCAT_MANAGER_INCLUDE_DIR: /tmp/rt-control-ci-ws/src/vendor/ecat_icube/ethercat_manager/include
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout frozen legacy baseline
        uses: actions/checkout@v4
        with:
          repository: SevenovaHangzhou/robot_driver
          ref: 6bc94cd564361b9e4aa785af74683ecf13e258ce
          path: .legacy/robot_driver
          persist-credentials: false
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            git \
            liburdfdom-tools \
            libtool \
            pkg-config \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            python3-yaml
      - name: Import frozen source dependencies
        shell: bash
        run: |
          mkdir -p "${RT_CONTROL_NATIVE_WS}"
          vcs import --shallow --retry 5 --workers 1 \
            "${RT_CONTROL_NATIVE_WS}" < deps.repos
          tools/bootstrap_native_dev.sh prepare
      - name: Install pinned IgH userspace dependency
        shell: bash
        run: |
          source versions.env
          [[ "${IGH_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          git init /tmp/ethercat
          git -C /tmp/ethercat remote add origin \
            https://gitlab.com/etherlab.org/ethercat.git
          git -C /tmp/ethercat fetch --depth 1 origin "${IGH_COMMIT}"
          git -C /tmp/ethercat checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ethercat rev-parse HEAD)" = "${IGH_COMMIT}"
          (
            cd /tmp/ethercat
            ./bootstrap
            ./configure --prefix=/usr/local/etherlab --disable-kernel
            make -j"$(nproc)"
            make install
          )
          ldconfig
      - name: Install package dependencies
        shell: bash
        run: |
          rosdep init 2>/dev/null || true
          rosdep update
          rt_control_packages=(
            robot_rt_control_interfaces
            robot_system_interfaces
            robot_interfaces_qos
            bms_node
            canopen_master_driver
            canopen_ros2_control
            control_api_adapter
            ethercat_driver
            ethercat_generic_cia402_drive
            joint_trajectory_controller
            plc_node
            robot_description
            rt_control_interfaces
            robot_hw_ethercat
            robot_hw_canopen
            enable_manager
            rt_diagnostics
            x503_force_sensor
            rt_control_bringup
          )
          mapfile -t dependency_paths < <(
            colcon list \
              --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
              --paths-only \
              --packages-up-to "${rt_control_packages[@]}"
          )
          rosdep install --from-paths "${dependency_paths[@]}" \
            --ignore-src \
            --rosdistro humble \
            --skip-keys ethercat_driver \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types buildtool_export \
            --dependency-types exec \
            --dependency-types test \
            -r -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
            --packages-up-to \
            robot_rt_control_interfaces \
            robot_system_interfaces \
            robot_interfaces_qos \
            bms_node \
            canopen_master_driver \
            canopen_ros2_control \
            control_api_adapter \
            ethercat_driver \
            ethercat_generic_cia402_drive \
            joint_trajectory_controller \
            plc_node \
            robot_description \
            rt_control_interfaces \
            robot_hw_ethercat \
            robot_hw_canopen \
            enable_manager \
            rt_diagnostics \
            x503_force_sensor \
            rt_control_bringup
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+ \
            --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
            --packages-up-to \
            robot_rt_control_interfaces \
            robot_system_interfaces \
            robot_interfaces_qos \
            bms_node \
            canopen_master_driver \
            canopen_ros2_control \
            control_api_adapter \
            ethercat_driver \
            ethercat_generic_cia402_drive \
            joint_trajectory_controller \
            plc_node \
            robot_description \
            rt_control_interfaces \
            robot_hw_ethercat \
            robot_hw_canopen \
            enable_manager \
            rt_diagnostics \
            x503_force_sensor \
            rt_control_bringup
          colcon test-result --verbose
      - name: Validate shared robot description
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          xacro src/description/robot_description/urdf/robot.urdf.xacro \
            > /tmp/robot-description-ci.urdf
          check_urdf /tmp/robot-description-ci.urdf
      - name: Enforce frozen EtherCAT migration gate
        run: |
          python3 tools/diff_legacy.py \
            --legacy-root .legacy/robot_driver \
            --target-root .
