name: rt-control-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rt-control-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace inside the job container
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install quality-gate tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-coverage \
            python3-pip \
            python3-pytest \
            python3-yaml \
            ripgrep \
            shellcheck
          python3 -m pip install --no-cache-dir pre-commit==3.7.1
      - name: Run the same gate used by pre-commit
        shell: bash
        env:
          REQUIRE_SHELLCHECK: "1"
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Enforce pull request contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: python3 tools/pr_contract_gate.py --event-path "${GITHUB_EVENT_PATH}"

  build:
    needs: governance
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 30
    env:
      RT_CONTROL_NATIVE_WS: /tmp/rt-control-ci-ws
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout frozen legacy baseline
        uses: actions/checkout@v4
        with:
          repository: SevenovaHangzhou/robot_driver
          ref: 6bc94cd564361b9e4aa785af74683ecf13e258ce
          path: .legacy/robot_driver
          persist-credentials: false
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            git \
            liburdfdom-tools \
            libtool \
            pkg-config \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            python3-yaml
      - name: Import frozen source dependencies
        shell: bash
        run: |
          mkdir -p "${RT_CONTROL_NATIVE_WS}"
          vcs import --shallow --retry 5 --workers 1 \
            "${RT_CONTROL_NATIVE_WS}" < deps.repos
          tools/bootstrap_native_dev.sh prepare
      - name: Install pinned IgH userspace dependency
        shell: bash
        run: |
          source versions.env
          [[ "${IGH_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          git init /tmp/ethercat
          git -C /tmp/ethercat remote add origin \
            https://gitlab.com/etherlab.org/ethercat.git
          git -C /tmp/ethercat fetch --depth 1 origin "${IGH_COMMIT}"
          git -C /tmp/ethercat checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ethercat rev-parse HEAD)" = "${IGH_COMMIT}"
          (
            cd /tmp/ethercat
            ./bootstrap
            ./configure --prefix=/usr/local/etherlab --disable-kernel
            make -j"$(nproc)"
            make install
          )
          ldconfig
      - name: Install package dependencies
        shell: bash
        run: |
          rosdep init 2>/dev/null || true
          rosdep update
          rt_control_packages=(
            robot_rt_control_interfaces
            robot_system_interfaces
            robot_interfaces_qos
            bms_node
            canopen_master_driver
            canopen_ros2_control
            control_api_adapter
            ethercat_driver
            ethercat_generic_cia402_drive
            joint_trajectory_controller
            plc_node
            robot_description
            rt_control_interfaces
            robot_hw_ethercat
            robot_hw_canopen
            enable_manager
            rt_diagnostics
            rt_control_bringup
          )
          mapfile -t dependency_paths < <(
            colcon list \
              --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
              --paths-only \
              --packages-up-to "${rt_control_packages[@]}"
          )
          rosdep install --from-paths "${dependency_paths[@]}" \
            --ignore-src \
            --rosdistro humble \
            --skip-keys ethercat_driver \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types buildtool_export \
            --dependency-types exec \
            --dependency-types test \
            -r -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
            --packages-up-to \
            robot_rt_control_interfaces \
            robot_system_interfaces \
            robot_interfaces_qos \
            bms_node \
            canopen_master_driver \
            canopen_ros2_control \
            control_api_adapter \
            ethercat_driver \
            ethercat_generic_cia402_drive \
            joint_trajectory_controller \
            plc_node \
            robot_description \
            rt_control_interfaces \
            robot_hw_ethercat \
            robot_hw_canopen \
            enable_manager \
            rt_diagnostics \
            rt_control_bringup
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+ \
            --base-paths src "${RT_CONTROL_NATIVE_WS}/src/vendor" \
            --packages-up-to \
            robot_rt_control_interfaces \
            robot_system_interfaces \
            robot_interfaces_qos \
            bms_node \
            canopen_master_driver \
            canopen_ros2_control \
            control_api_adapter \
            ethercat_driver \
            ethercat_generic_cia402_drive \
            joint_trajectory_controller \
            plc_node \
            robot_description \
            rt_control_interfaces \
            robot_hw_ethercat \
            robot_hw_canopen \
            enable_manager \
            rt_diagnostics \
            rt_control_bringup
          colcon test-result --verbose
      - name: Validate shared robot description
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          xacro src/description/robot_description/urdf/robot.urdf.xacro \
            > /tmp/robot-description-ci.urdf
          check_urdf /tmp/robot-description-ci.urdf
      - name: Enforce frozen EtherCAT migration gate
        run: |
          python3 tools/diff_legacy.py \
            --legacy-root .legacy/robot_driver \
            --target-root .

  container:
    needs: governance
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the production RT-Control image
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          [[ "${IGH_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          docker build \
            --file docker/rt-control/Dockerfile \
            --build-arg IGH_VERSION="${IGH_VERSION}" \
            --build-arg IGH_COMMIT="${IGH_COMMIT}" \
            --tag rt-control:ci \
            .
      - name: Start and stop an isolated no-device Mock container
        shell: bash
        run: |
          set -euo pipefail
          container_name=rt-control-ci-mock
          strip_ansi()
          {
            sed -E $'s/\033\[[0-9;]*[mK]//g'
          }

          docker run --detach \
            --name "${container_name}" \
            --network none \
            --ipc private \
            --stop-timeout 100 \
            --env ROS_DOMAIN_ID=142 \
            --env RMW_IMPLEMENTATION=rmw_fastrtps_cpp \
            rt-control:ci \
            /opt/rt_control_ws/install/lib/rt_control_bringup/rt_control_start \
            use_mock_hardware:=true \
            start_plc:=false \
            start_bms:=false

          ready=0
          for _ in $(seq 1 90); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_name}")" != "true" ]]; then
              docker logs "${container_name}" 2>&1
              exit 1
            fi
            controller_state="$(
              timeout 8 docker exec "${container_name}" bash -lc \
                'source /opt/rt_control_ws/install/setup.bash && ros2 control list_controllers' \
                2>/dev/null | strip_ansi || true
            )"
            if grep -Eq '^joint_state_broadcaster[[:space:]].*active[[:space:]]*$' <<<"${controller_state}" &&
              grep -Eq '^rt_internal_state_broadcaster[[:space:]].*active[[:space:]]*$' <<<"${controller_state}" &&
              grep -Eq '^diff_drive_controller[[:space:]].*active[[:space:]]*$' <<<"${controller_state}" &&
              grep -Eq '^enable_manager[[:space:]].*active[[:space:]]*$' <<<"${controller_state}" &&
              grep -Eq '^whole_body_jtc[[:space:]].*inactive[[:space:]]*$' <<<"${controller_state}"
            then
              ready=1
              break
            fi
            sleep 1
          done
          if (( ready == 0 )); then
            printf '%s\n' "${controller_state:-no controller state available}"
            docker logs "${container_name}" 2>&1
            exit 1
          fi
          printf '%s\n' "${controller_state}"

          docker stop --time 100 "${container_name}"
          container_logs="$(docker logs "${container_name}" 2>&1)"
          printf '%s\n' "${container_logs}"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "${container_name}")"
          test "${exit_code}" -eq 0
          grep -F 'rt_control shutdown disable result: ok=true' <<<"${container_logs}"
          if grep -Eq 'UNCLEAN_SHUTDOWN|\[ERROR\]|\[FATAL\]' <<<"${container_logs}"; then
            exit 1
          fi
      - name: Clean up the Mock container
        if: always()
        shell: bash
        run: docker rm --force rt-control-ci-mock >/dev/null 2>&1 || true
