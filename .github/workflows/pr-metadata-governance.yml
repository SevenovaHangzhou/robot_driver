name: pr-metadata-governance

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: pr-metadata-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce pull request contract
        shell: bash
        run: python3 tools/pr_contract_gate.py --event-path "${GITHUB_EVENT_PATH}"
