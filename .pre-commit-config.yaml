minimum_pre_commit_version: "2.17.0"
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: robot-quality-gate
        name: robot quality gate (including merge-base style checks)
        entry: tools/quality_gate.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
