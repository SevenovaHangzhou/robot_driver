# Data for tools/arch_check.py. Package layers come from the name prefix (ARCHITECTURE.md §1.3).
#
# exceptions: approved deviations, one per rule and file:
#   - {rule: NAME-3, path: <file>, reason: <why>, approved: "<who> <date>"}
# An exception that no longer matches a finding is itself reported.
exceptions:
- rule: NAME-3
  path: src/rt_control/integ_operator_web/web/arm/sequence-presets.json
  reason: 台架调试网页的机械臂测试姿态预设（按关节名记录的位置），属调试工具数据
  approved: user 2026-11-06
- rule: SIZE-1
  path: src/rt_control/ctrl_enable_manager/src/enable_manager_controller.cpp
  reason: 实时使能状态机不拆，非实时部分已移到同包独立文件；使能流程不再扩展（ARCHITECTURE §3 唯一例外）
  approved: user 2026-11-03
# Peripherals that only listen on their bus: production C/C++ never writes (LAYER-5).
# The LPMS IMU node only listens on its CAN bus (ELECTRI-105).
listen_only_peripherals:
- periph_imu_lpms
# NAME-2: vendor and product words, allowed only in hw_*, hwcfg_machines and periph_*.
# Machine and joint names are read from hwcfg_machines itself.
vendor_names:
- ZeroErr
- Kinco
- DaMiao
- Bluepoint
- LPMS
- X503
- Ti5
- Inovance
- EcCiA402Drive
- GenericEcSlave
# DUP-1: one owner per extracted implementation; its signature anywhere else is reported.
# owner "" marks an implementation that was deleted and must not return.
duplicates:
- name: SocketCAN 原始套接字
  owner: infra_socketcan
  pattern: '\b(?:PF_CAN|AF_CAN|CAN_RAW)\b'
- name: Modbus TCP 帧头（MBAP）
  owner: infra_modbus
  pattern: '\bMBAP\b|\btransaction_id'
- name: CiA402 状态字解码
  owner: hw_semantic_components
  pattern: '\b0x00[46][Ff]U?\b'
- name: 渲染器 XML 参数（infra_renderer.xml_param）
  owner: infra_renderer
  pattern: '"param",\s*name='
- name: double 塞进整型原子量（改用 std::atomic<double>）
  owner: ""
  pattern: '\b(?:encode|decode)_double\b'
